<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飛鏢投擲骨架分析器（優化版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 整體背景：寧靜藍色系 */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            background: #f9fbff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(15,23,42,0.10);
            padding: 20px 16px 18px;
            max-width: 960px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .container {
                padding: 24px 28px 22px;
            }
        }

        h1 {
            color: #1d4ed8;
            text-align: center;
            margin-bottom: 4px;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 14px;
        }

        /* 來源切換 */
        .source-tabs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            max-width: 420px;
            margin: 0 auto 10px;
        }

        .source-tab-btn {
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            padding: 9px 8px;
            text-align: center;
            font-weight: 600;
            background: #e5e7eb;
            color: #374151;
            transition: background 0.15s, color 0.15s;
        }

        .source-tab-btn.active {
            background: #1d4ed8;
            color: #fff;
        }

        /* 按鈕區：RWD 網格 */
        .controls {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            max-width: 820px;
            margin: 8px auto 14px;
        }

        .control-btn {
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            padding: 10px 8px;
            text-align: center;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 1px 4px rgba(15,23,42,0.15);
            min-height: 38px;
            background: #e5e7eb;
            color: #111827;
        }

        .control-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 選擇檔案：灰色 */
        .upload-btn {
            background: #e5e7eb;
            color: #111827;
        }

        /* 相機：靛色 */
        .camera-btn {
            background: #a5b4fc;
            color: #1e1b4b;
        }

        /* 播放：綠色（柔和一點） */
        .play-btn {
            background: #4ade80;
            color: #064e3b;
        }

        /* 暫停：橙色（偏柔和） */
        .pause-btn {
            background: #fdba74;
            color: #7c2d12;
        }

        /* 重播：藍色（配合主題） */
        .reset-btn {
            background: #60a5fa;
            color: #eff6ff;
        }

        /* 骨架開關：淡藍灰 */
        .toggle-btn {
            background: #bfdbfe;
            color: #1e3a8a;
        }

        /* 手腕軌跡：紫色 */
        .wrist-trace-btn {
            background: #c084fc;
            color: #4c0519;
        }

        /* 平滑開關：薄荷綠 */
        .smooth-btn {
            background: #99f6e4;
            color: #134e4a;
        }

        /* 錄製：紅色（不要太亮） */
        .record-btn {
            background: #f97373;
            color: #fff5f5;
        }

        .record-btn.recording {
            background: #ef4444;
            animation: pulse 1.1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.55); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(239,68,68,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(15,23,42,0.18);
            opacity: 0.96;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            margin: 10px 0 8px;
            background: #020617;
            border-radius: 14px;
            overflow: hidden;
            display: none;
        }

        #videoElement {
            width: 100%;
            height: auto;
            display: block;
        }

        #canvasElement {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .loading {
            text-align: center;
            color: #1d4ed8;
            font-size: 14px;
            margin: 6px 0 4px;
        }

        .error-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 12px;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 13px;
            display: none;
            white-space: pre-line;
        }

        .info {
            background: #e0ecff;
            padding: 10px 12px;
            border-radius: 14px;
            margin-top: 8px;
            font-size: 13px;
            color: #1f2937;
            line-height: 1.7;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .info-label {
            font-weight: 600;
        }

        .info-value {
            font-weight: 500;
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>飛鏢投擲骨架分析器</h1>
        <div class="subtitle">優化版：平滑濾波 + 相機即時錄製</div>

        <!-- 來源切換：上傳影片 / 開啟相機 -->
        <div class="source-tabs">
            <button class="source-tab-btn active" id="uploadBtn">
                📁 選擇影片
            </button>
            <input type="file" id="fileInput" accept="video/*" style="display:none;" />
            <button class="source-tab-btn camera-btn" id="cameraBtn">
                🎥 開啟相機
            </button>
        </div>

        <!-- 控制區：RWD -->
        <div class="controls" id="controls">
            <button class="control-btn play-btn" id="playBtn" onclick="playVideo()" disabled>播放</button>
            <button class="control-btn pause-btn" id="pauseBtn" onclick="pauseVideo()" disabled>暫停</button>
            <button class="control-btn reset-btn" id="resetBtn" onclick="resetVideo()" disabled>重新播放</button>
            <button class="control-btn toggle-btn" id="toggleSkeletonBtn" onclick="toggleSkeleton()" disabled>骨架：開</button>
            <button class="control-btn wrist-trace-btn" id="toggleWristTraceBtn" onclick="toggleWristTrace()" disabled>手腕軌跡：關</button>
            <button class="control-btn smooth-btn" id="toggleSmoothBtn" onclick="toggleSmoothing()" disabled>平滑：開</button>
            <button class="control-btn record-btn" id="recordBtn" onclick="toggleRecording()" disabled>開始錄製</button>
        </div>

        <div id="loadingText" class="loading" style="display:none;">
            正在載入骨架模型，請稍候...
        </div>

        <div class="canvas-container" id="canvasContainer">
            <video id="videoElement" playsinline muted></video>
            <canvas id="canvasElement"></canvas>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <div class="info">
            <div class="info-row">
                <span class="info-label">來源：</span>
                <span class="info-value" id="statusSource">尚未選擇</span>
            </div>
            <div class="info-row">
                <span class="info-label">播放狀態：</span>
                <span class="info-value" id="statusPlayback">待機</span>
            </div>
            <div class="info-row">
                <span class="info-label">骨架載入：</span>
                <span class="info-value" id="statusModel">載入中…</span>
            </div>
            <div class="info-row">
                <span class="info-label">骨架顯示：</span>
                <span class="info-value" id="statusSkeletonShow">開</span>
            </div>
            <div class="info-row">
                <span class="info-label">手腕軌跡：</span>
                <span class="info-value" id="statusWristTrace">關</span>
            </div>
            <div class="info-row">
                <span class="info-label">平滑濾波：</span>
                <span class="info-value" id="statusSmooth">開</span>
            </div>
            <div class="info-row">
                <span class="info-label">目前幀率：</span>
                <span class="info-value" id="statusFPS">-- FPS</span>
            </div>
            <div class="info-row">
                <span class="info-label">錄製狀態：</span>
                <span class="info-value" id="statusRecording">關</span>
            </div>
        </div>
    </div>

    <script type="module">
        // 匯入 MediaPipe Tasks Vision 中的 PoseLandmarker 與 FilesetResolver
        import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

        // === DOM 元素 ===
        const video = document.getElementById("videoElement");
        const canvas = document.getElementById("canvasElement");
        const ctx = canvas.getContext("2d");
        const canvasContainer = document.getElementById("canvasContainer");
        const loadingText = document.getElementById("loadingText");
        const errorMsg = document.getElementById("errorMsg");

        const uploadBtn = document.getElementById("uploadBtn");
        const fileInput = document.getElementById("fileInput");
        const cameraBtn = document.getElementById("cameraBtn");
        const playBtn = document.getElementById("playBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resetBtn = document.getElementById("resetBtn");
        const toggleSkeletonBtn = document.getElementById("toggleSkeletonBtn");
        const toggleWristTraceBtn = document.getElementById("toggleWristTraceBtn");
        const toggleSmoothBtn = document.getElementById("toggleSmoothBtn");
        const recordBtn = document.getElementById("recordBtn");

        const statusSource = document.getElementById("statusSource");
        const statusPlayback = document.getElementById("statusPlayback");
        const statusModel = document.getElementById("statusModel");
        const statusSkeletonShow = document.getElementById("statusSkeletonShow");
        const statusWristTrace = document.getElementById("statusWristTrace");
        const statusSmooth = document.getElementById("statusSmooth");
        const statusFPS = document.getElementById("statusFPS");
        const statusRecording = document.getElementById("statusRecording");

        // === MediaPipe / 偵測相關 ===
        let poseLandmarker = null;     // MediaPipe Pose 模型實例
        let modelReady = false;        // 模型是否載入完成

        // 檢測迴圈控制
        let detecting = false;
        const hasRVFC = "requestVideoFrameCallback" in HTMLVideoElement.prototype; // 是否支援 requestVideoFrameCallback
        let rvfcId = null;
        let rafId = null;

        // 來源模式："file" 或 "camera"
        let sourceMode = null;
        let cameraStream = null;

        // 骨架顯示與影片來源
        let skeletonEnabled = true;
        let currentObjectUrl = null;

        // === 平滑濾波（One Euro Filter）相關 ===
        // One Euro Filter：對每個關鍵點的 x / y 座標各自做低延遲平滑，
        // 速度快時濾波弱（跟得上動作），速度慢時濾波強（去除手震/偵測抖動）。
        let smoothingEnabled = true;
        const ONE_EURO_MIN_CUTOFF = 1.0;
        const ONE_EURO_BETA = 0.4;
        const ONE_EURO_D_CUTOFF = 1.0;

        function lowPassAlpha(cutoff, dt) {
            const tau = 1.0 / (2 * Math.PI * cutoff);
            return 1.0 / (1.0 + tau / dt);
        }

        class OneEuroFilter1D {
            constructor(minCutoff = ONE_EURO_MIN_CUTOFF, beta = ONE_EURO_BETA, dCutoff = ONE_EURO_D_CUTOFF) {
                this.minCutoff = minCutoff;
                this.beta = beta;
                this.dCutoff = dCutoff;
                this.xPrev = null;
                this.dxPrev = 0;
                this.tPrev = null;
            }
            filter(x, t) {
                if (this.tPrev === null) {
                    this.tPrev = t;
                    this.xPrev = x;
                    this.dxPrev = 0;
                    return x;
                }
                const dt = Math.max((t - this.tPrev) / 1000, 1 / 120); // 秒，避免除以 0
                this.tPrev = t;

                const dx = (x - this.xPrev) / dt;
                const aD = lowPassAlpha(this.dCutoff, dt);
                const dxHat = aD * dx + (1 - aD) * this.dxPrev;

                const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
                const a = lowPassAlpha(cutoff, dt);
                const xHat = a * x + (1 - a) * this.xPrev;

                this.xPrev = xHat;
                this.dxPrev = dxHat;
                return xHat;
            }
            reset() {
                this.xPrev = null;
                this.dxPrev = 0;
                this.tPrev = null;
            }
        }

        // 每個關鍵點各自一組 x/y 濾波器（延遲建立）
        const landmarkFiltersX = new Map();
        const landmarkFiltersY = new Map();

        function getFilter(map, idx) {
            let f = map.get(idx);
            if (!f) {
                f = new OneEuroFilter1D();
                map.set(idx, f);
            }
            return f;
        }

        function resetSmoothing() {
            landmarkFiltersX.clear();
            landmarkFiltersY.clear();
        }

        function smoothLandmarks(landmarks, t) {
            if (!smoothingEnabled) return landmarks;
            return landmarks.map((lm, i) => {
                if (!lm) return lm;
                const fx = getFilter(landmarkFiltersX, i);
                const fy = getFilter(landmarkFiltersY, i);
                return {
                    x: fx.filter(lm.x, t),
                    y: fy.filter(lm.y, t),
                    z: lm.z,
                    visibility: lm.visibility
                };
            });
        }

        // === 手腕軌跡相關 ===
        let wristTraceEnabled = false;
        const leftWristTrace = [];   // 左手腕軌跡點
        const rightWristTrace = [];  // 右手腕軌跡點
        const MAX_TRACE_POINTS = 200; // 最多保留的軌跡點數

        // === 錄製相關 ===
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        // === FPS 計算相關 ===
        const frameTimes = [];    // 紀錄最近 1 秒內每幀時間
        let lastFPSUpdate = 0;    // 上次更新 FPS 顯示的時間

        // 偵測節流時間（毫秒）：越大 → 偵測越少、越順；越小 → 偵測越頻繁、越吃資源
        const DETECT_INTERVAL_MS = 40; // 約 ~25 FPS 偵測，動作較快時追蹤更緊
        let lastDetectTime = 0;
        let lastLandmarks = null; // 最近一次偵測到（並已平滑）的骨架點，用來在未偵測幀重畫

        // === 共用 UI 函式 ===
        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = "block";
        }

        function hideError() {
            errorMsg.textContent = "";
            errorMsg.style.display = "none";
        }

        function setPlaybackStatus(text) {
            statusPlayback.textContent = text;
        }

        function setModelStatusLoaded() {
            statusModel.textContent = "已載入";
        }

        function setRecordingStatus(text) {
            statusRecording.textContent = text;
        }

        function enableControls() {
            playBtn.disabled = false;
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            toggleSkeletonBtn.disabled = false;
            toggleWristTraceBtn.disabled = false;
            toggleSmoothBtn.disabled = false;
            recordBtn.disabled = false;
        }

        // === 初始化 MediaPipe Pose 模型 ===
        async function initPoseLandmarker() {
            loadingText.style.display = "block";
            try {
                // 載入 WebAssembly 與相關資源
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );
                // 建立 PoseLandmarker 實例
                poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 1
                });
                modelReady = true;
                loadingText.style.display = "none";
                setModelStatusLoaded();
            } catch (e) {
                loadingText.style.display = "none";
                showError("MediaPipe 初始化失敗：" + e.message);
                console.error(e);
            }
        }

        // 清空畫布
        function clearCanvas() {
            if (!canvas.width || !canvas.height) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // 停止偵測迴圈
        function stopDetectLoop() {
            detecting = false;
            if (rvfcId !== null && typeof video.cancelVideoFrameCallback === "function") {
                video.cancelVideoFrameCallback(rvfcId);
            }
            rvfcId = null;
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
            }
            rafId = null;
        }

        // 啟動偵測迴圈（依瀏覽器支援選擇 RVFC 或 RAF）
        function startDetectLoop() {
            if (detecting) return;
            if (video.paused || video.ended) return;
            detecting = true;
            if (hasRVFC) {
                rvfcId = video.requestVideoFrameCallback(onVideoFrame);
            } else {
                rafId = requestAnimationFrame(onAnimationFrame);
            }
        }

        // 使用 requestVideoFrameCallback 的迴圈
        function onVideoFrame() {
            processFrame();
            if (detecting && !video.paused && !video.ended) {
                rvfcId = video.requestVideoFrameCallback(onVideoFrame);
            } else {
                detecting = false;
            }
        }

        // 使用 requestAnimationFrame 的迴圈
        function onAnimationFrame() {
            processFrame();
            if (detecting && !video.paused && !video.ended) {
                rafId = requestAnimationFrame(onAnimationFrame);
            } else {
                detecting = false;
            }
        }

        // 更新 FPS 顯示（計算每秒幀數）
        function updateFPS(now) {
            frameTimes.push(now);
            // 移除超過 1 秒的舊時間戳
            while (frameTimes.length && frameTimes[0] <= now - 1000) {
                frameTimes.shift();
            }
            const fps = frameTimes.length;
            // 每 0.2 秒更新一次畫面上的數字
            if (now - lastFPSUpdate > 200) {
                statusFPS.textContent = fps.toFixed(0) + " FPS";
                lastFPSUpdate = now;
            }
        }

        // 單幀處理：畫影片 +（必要時）做骨架偵測 + 重畫骨架
        function processFrame() {
            const now = performance.now();

            // 1. 更新 FPS
            updateFPS(now);

            // 2. 先把目前影片畫到畫布
            try {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            } catch (e) {
                // 影片剛開始可能尚無 frame，這裡忽略錯誤
            }

            // 模型未載入或沒開骨架時就只顯示影片
            if (!poseLandmarker || !modelReady) return;
            if (!skeletonEnabled) return;

            try {
                // 3. 節流骨架偵測：間隔時間到了才呼叫 detectForVideo
                if (now - lastDetectTime >= DETECT_INTERVAL_MS) {
                    lastDetectTime = now;
                    const result = poseLandmarker.detectForVideo(video, now);
                    if (result.landmarks && result.landmarks.length > 0) {
                        // 每幀都先做平滑，再存起來給繪製 / 軌跡使用，
                        // 這樣骨架線條與手腕軌跡都會跟著變順、不抖動
                        lastLandmarks = smoothLandmarks(result.landmarks[0], now);
                    }
                }

                // 4. 如果有最近一次的骨架結果，就畫在影片上
                if (lastLandmarks) {
                    drawSkeleton(lastLandmarks);
                    if (wristTraceEnabled) {
                        updateWristTrace(lastLandmarks);
                        drawWristTrace();
                    }
                }
            } catch (e) {
                console.error("detectForVideo 錯誤:", e);
            }
        }

        // 畫手腕軌跡（用二次貝茲曲線平滑連接，視覺上比純折線更順）
        function drawWristTrace() {
            if (!wristTraceEnabled) return;

            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(255,60,60,0.85)";
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            drawSmoothPolyline(leftWristTrace);
            drawSmoothPolyline(rightWristTrace);
        }

        // 用相鄰點中點作為控制點，畫出平滑曲線（Catmull-Rom 風格的簡化版）
        function drawSmoothPolyline(points) {
            if (points.length < 2) return;
            ctx.beginPath();
            const p0 = points[0];
            ctx.moveTo(p0.x * canvas.width, p0.y * canvas.height);

            if (points.length === 2) {
                const p1 = points[1];
                ctx.lineTo(p1.x * canvas.width, p1.y * canvas.height);
                ctx.stroke();
                return;
            }

            for (let i = 1; i < points.length - 1; i++) {
                const cur = points[i];
                const next = points[i + 1];
                const curX = cur.x * canvas.width;
                const curY = cur.y * canvas.height;
                const nextX = next.x * canvas.width;
                const nextY = next.y * canvas.height;
                const midX = (curX + nextX) / 2;
                const midY = (curY + nextY) / 2;
                ctx.quadraticCurveTo(curX, curY, midX, midY);
            }
            const last = points[points.length - 1];
            ctx.lineTo(last.x * canvas.width, last.y * canvas.height);
            ctx.stroke();
        }

        // 更新手腕軌跡
        function updateWristTrace(landmarks) {
            if (!landmarks || !Array.isArray(landmarks)) return;

            // 左手腕 (15) 與右手腕 (16)
            const leftWrist = landmarks[15];
            const rightWrist = landmarks[16];

            if (leftWrist) {
                leftWristTrace.push({ x: leftWrist.x, y: leftWrist.y });
                if (leftWristTrace.length > MAX_TRACE_POINTS) {
                    leftWristTrace.shift();
                }
            }

            if (rightWrist) {
                rightWristTrace.push({ x: rightWrist.x, y: rightWrist.y });
                if (rightWristTrace.length > MAX_TRACE_POINTS) {
                    rightWristTrace.shift();
                }
            }
        }

        // 清除手腕軌跡
        function clearWristTrace() {
            leftWristTrace.length = 0;
            rightWristTrace.length = 0;
        }

        // 畫骨架線段與節點
        function drawSkeleton(landmarks) {
            if (!landmarks || !Array.isArray(landmarks)) return;

            // 骨架連接關係（不含手指）
            const connections = [
                [11, 12],
                [11, 23],
                [12, 24],
                [23, 24],
                [11, 13],
                [13, 15],
                [12, 14],
                [14, 16],
                [23, 25],
                [25, 27],
                [27, 29],
                [29, 31],
                [24, 26],
                [26, 28],
                [28, 30],
                [30, 32]
            ];

            // 粗白線
            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(255,255,255,0.9)";

            // 畫線段
            for (const [s, e] of connections) {
                const a = landmarks[s];
                const b = landmarks[e];
                if (!a || !b) continue;
                ctx.beginPath();
                ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
                ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
                ctx.stroke();
            }

            // 紅色節點（略過臉與手指）
            for (let i = 0; i < landmarks.length; i++) {
                if (i <= 10) continue;            // 0–10 為頭部/臉部
                if (i >= 17 && i <= 22) continue; // 17–22 為手指節點
                const lm = landmarks[i];
                if (!lm) continue;

                const x = lm.x * canvas.width;
                const y = lm.y * canvas.height;
                const alpha = lm.visibility != null ? lm.visibility : 0.7;
                const r = 7; // 節點半徑

                ctx.beginPath();
                ctx.fillStyle = `rgba(255,0,0,${alpha})`;
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // === 錄製相關：錄 canvas 畫面（影片 + 骨架） ===
        function startRecording() {
            if (isRecording) return;
            try {
                // 從 canvas 建立串流（含影片與骨架）
                const stream = canvas.captureStream(30);

                // 嘗試使用 MP4 編碼，如果瀏覽器不支援則回退至 WebM
                let selectedMimeType = "video/webm;codecs=vp9";
                const supportedMimeTypes = [
                    "video/mp4;codecs=avc1,mp4a.40.2",
                    "video/mp4",
                    "video/webm;codecs=vp9",
                    "video/webm"
                ];

                for (const mimeType of supportedMimeTypes) {
                    if (MediaRecorder.isTypeSupported(mimeType)) {
                        selectedMimeType = mimeType;
                        break;
                    }
                }

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: selectedMimeType,
                    videoBitsPerSecond: 5000000
                });
            } catch (e) {
                showError("錄製初始化失敗：" + e.message + "\n\n此瀏覽器可能不支援 canvas.captureStream()，請改用 Chrome / Edge 最新版。");
                console.error(e);
                return;
            }

            recordedChunks = [];

            // 收集錄製資料片段
            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            // 停止時產出 Blob 並觸發下載
            mediaRecorder.onstop = () => {
                if (!recordedChunks.length) return;
                const mimeType = mediaRecorder.mimeType || "video/mp4";
                const isMP4 = mimeType.includes("mp4");
                const fileExt = isMP4 ? "mp4" : "webm";

                const blob = new Blob(recordedChunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "dart-skeleton-" + Date.now() + "." + fileExt;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.textContent = "停止錄製";
            recordBtn.classList.add("recording");
            setRecordingStatus("錄製中");
        }

        function stopRecording() {
            if (!isRecording || !mediaRecorder) return;
            try {
                mediaRecorder.stop();
            } catch (e) {
                console.error("MediaRecorder 停止錯誤:", e);
            }
            isRecording = false;
            recordBtn.textContent = "開始錄製";
            recordBtn.classList.remove("recording");
            setRecordingStatus("關");
        }

        function stopRecordingIfNeeded() {
            if (isRecording) {
                stopRecording();
            }
        }

        // === 共用：切換來源前的重置 ===
        function resetForNewSource() {
            hideError();
            stopRecordingIfNeeded();
            stopDetectLoop();
            video.pause();
            clearCanvas();
            clearWristTrace();
            resetSmoothing();
            lastLandmarks = null;

            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }
            if (cameraStream) {
                cameraStream.getTracks().forEach((t) => t.stop());
                cameraStream = null;
            }
        }

        function setActiveSourceTab(mode) {
            uploadBtn.classList.toggle("active", mode === "file");
            cameraBtn.classList.toggle("active", mode === "camera");
        }

        // === 檔案來源 ===
        uploadBtn.addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            resetForNewSource();
            sourceMode = "file";
            setActiveSourceTab("file");
            statusSource.textContent = "影片檔案：" + file.name;

            video.removeAttribute("muted");
            video.controls = false;

            const url = URL.createObjectURL(file);
            currentObjectUrl = url;
            video.srcObject = null;
            video.src = url;
            setPlaybackStatus("載入影片中…");
        });

        // === 相機來源（即時錄影） ===
        cameraBtn.addEventListener("click", async () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showError("此瀏覽器不支援相機存取（getUserMedia），請改用手機/電腦的 Chrome、Safari 最新版，並確認網址為 https 或 localhost。");
                return;
            }
            try {
                resetForNewSource();
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                cameraStream = stream;
                sourceMode = "camera";
                setActiveSourceTab("camera");
                statusSource.textContent = "相機即時串流";

                video.srcObject = stream;
                video.src = "";
                video.muted = true;
                setPlaybackStatus("相機啟動中…");
            } catch (e) {
                showError("無法開啟相機：" + e.message + "\n\n請確認已允許瀏覽器存取相機權限。");
                console.error(e);
            }
        });

        // 影片 metadata 載入完成：設定畫布大小與啟用按鈕
        video.addEventListener("loadedmetadata", () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            canvasContainer.style.display = "block";
            enableControls();

            if (sourceMode === "camera") {
                // 相機來源直接自動播放（即時預覽 + 即時骨架）
                video.play()
                    .then(() => {
                        setPlaybackStatus("即時預覽中");
                        startDetectLoop();
                    })
                    .catch((e) => {
                        showError("相機預覽啟動失敗：" + e.message);
                        console.error(e);
                    });
            } else {
                video.currentTime = 0;
                clearCanvas();
                setPlaybackStatus("待機");
            }
        });

        // 影片開始播放
        video.addEventListener("play", () => {
            hideError();
            setPlaybackStatus(sourceMode === "camera" ? "即時預覽中" : "播放中");
            startDetectLoop();
        });

        // 影片暫停
        video.addEventListener("pause", () => {
            stopDetectLoop();
            if (!video.ended) setPlaybackStatus("已暫停");
        });

        // 影片播完（僅檔案來源會觸發）
        video.addEventListener("ended", () => {
            stopDetectLoop();
            stopRecordingIfNeeded();
            clearWristTrace();
            setPlaybackStatus("已結束");
        });

        // 影片錯誤
        video.addEventListener("error", (e) => {
            const err = video.error;
            const msg = err
                ? `影片載入失敗 (錯誤碼 ${err.code}): ${err.message}`
                : "影片載入失敗";
            showError(msg + "\n\n請確認影片為 H.264 編碼的 MP4 格式");
            console.error("影片錯誤:", e, err);
        });

        // === 提供給 HTML 按鈕呼叫的控制函式（window.xxx） ===

        window.playVideo = async function () {
            hideError();
            try {
                await video.play();
            } catch (e) {
                showError("播放失敗：" + e.message);
                console.error("播放錯誤:", e);
            }
        };

        window.pauseVideo = function () {
            video.pause();
        };

        window.resetVideo = function () {
            if (sourceMode === "camera") {
                // 相機模式沒有「重播」概念，改為清空軌跡重新開始追蹤
                clearWristTrace();
                resetSmoothing();
                lastLandmarks = null;
                return;
            }
            stopRecordingIfNeeded();
            stopDetectLoop();
            clearCanvas();
            clearWristTrace();
            resetSmoothing();
            lastLandmarks = null;
            video.currentTime = 0;
            video.play()
                .then(() => {
                    setPlaybackStatus("播放中");
                    startDetectLoop();
                })
                .catch((e) => {
                    showError("重新播放失敗：" + e.message);
                    console.error("重新播放錯誤:", e);
                });
        };

        window.toggleSkeleton = function () {
            skeletonEnabled = !skeletonEnabled;
            if (!skeletonEnabled) {
                toggleSkeletonBtn.textContent = "骨架：關";
                statusSkeletonShow.textContent = "關";
                // 關閉骨架時，仍然畫影片但不畫骨架
            } else {
                toggleSkeletonBtn.textContent = "骨架：開";
                statusSkeletonShow.textContent = "開";
                if (!video.paused && !video.ended && !detecting) {
                    startDetectLoop();
                }
            }
        };

        window.toggleWristTrace = function () {
            wristTraceEnabled = !wristTraceEnabled;
            if (!wristTraceEnabled) {
                toggleWristTraceBtn.textContent = "手腕軌跡：關";
                statusWristTrace.textContent = "關";
                clearWristTrace();
            } else {
                toggleWristTraceBtn.textContent = "手腕軌跡：開";
                statusWristTrace.textContent = "開";
            }
        };

        window.toggleSmoothing = function () {
            smoothingEnabled = !smoothingEnabled;
            resetSmoothing();
            if (!smoothingEnabled) {
                toggleSmoothBtn.textContent = "平滑：關";
                statusSmooth.textContent = "關（原始座標）";
            } else {
                toggleSmoothBtn.textContent = "平滑：開";
                statusSmooth.textContent = "開";
            }
        };

        window.toggleRecording = function () {
            if (!video.src && !video.srcObject) {
                showError("請先載入影片或開啟相機再錄製。");
                return;
            }
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        };

        // 初始化 Pose 模型
        initPoseLandmarker();
    </script>
</body>
</html>
