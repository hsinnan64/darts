<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飛鏢投擲骨架分析器</title>
    <meta name="author" content="葉信男 YEH HSIN NAN" />
    <meta name="copyright" content="Copyright © 2026 葉信男 YEH HSIN NAN. All Rights Reserved." />
    <!-- 共用基礎樣式（版面、配色、.copyright 等），
         跟 privacy.html / sponsor.html 共用同一份。
         必須放在下面的 <style> 之前，本頁才覆寫得掉共用設定。 -->
    <link rel="stylesheet" href="site.css" />
    <style>
        /* 語言切換：固定在畫面右上角，不隨捲動位置改變 */
        /* 放在白色卡片「外面」正上方，跟卡片同寬、同樣置中，靠右對齊——
           跟著卡片走但不疊在卡片裡面，不管視窗多寬都跟卡片右邊緣切齊，
           也完全不會跟卡片內的標題/按鈕重疊，不需要再處理重疊斷點。 */
        .lang-switch {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 4px;
            max-width: 960px;
            width: 100%;
            margin: 0 auto 8px;
            padding: 0 4px;
        }

        .lang-btn {
            border: none;
            border-radius: 999px;
            /* 現在是站在頁面的漸層背景上（不是疊在白卡片上面），
               每顆按鈕自己要有底色才看得清楚，不能再依賴外層容器的背景 */
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(4px);
            box-shadow: 0 1px 4px rgba(15,23,42,0.12);
            color: #475569;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            cursor: pointer;
        }

        .lang-btn.active {
            background: #1d4ed8;
            color: #eff6ff;
        }

        /* 本頁要放影片與控制項，卡片是三頁裡最寬的（共用預設值就是 960px，
           這裡寫出來是為了讓人一眼看到本頁的寬度設定，不必去翻 site.css） */
        :root {
            --container-max: 960px;
        }

        /* 本頁內容密度高，桌機時的內距比另外兩頁收緊一點 */
        @media (min-width: 768px) {
            .container {
                padding: 24px 28px 22px;
            }
        }

        /* 標題下方緊接著控制按鈕，需要比另外兩頁更多的下方留白 */
        h1 {
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }

        /* 主控制區：只剩 4 個常駐按鈕（選擇影片/播放/重播/錄製），手機 2 欄、桌機 4 欄一排 */
        .controls {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            max-width: 860px;
            margin: 8px auto 10px;
        }

        @media (min-width: 480px) {
            .controls {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 10px;
            }
        }

        .control-btn {
            border: none;
            border-radius: 999px;
            cursor: pointer;
            /* 手機 3 欄時欄寬只有 ~100px，字級略縮才容得下最長的「背景：影片」 */
            font-size: 13px;
            padding: 11px 6px;
            text-align: center;
            white-space: nowrap;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 1px 4px rgba(15,23,42,0.15);
            min-height: 42px;
            background: #e5e7eb;
            color: #111827;
        }

        @media (min-width: 480px) {
            .control-btn {
                font-size: 14px;
                padding: 10px 8px;
                min-height: 38px;
            }
        }

        .control-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 選擇檔案：灰色 */
        .upload-btn {
            background: #e5e7eb;
            color: #111827;
        }

        /* 播放：綠色（柔和一點） */
        .play-btn {
            background: #4ade80;
            color: #064e3b;
        }

        /* 暫停：橙色（偏柔和） */
        .pause-btn {
            background: #fdba74;
            color: #7c2d12;
        }

        /* 重播：藍色（配合主題） */
        .reset-btn {
            background: #60a5fa;
            color: #eff6ff;
        }

        /* 骨架開關：淡藍灰 */
        .toggle-btn {
            background: #bfdbfe;
            color: #1e3a8a;
        }

        /* 純黑背景：深灰 */
        .blackbg-btn {
            background: #475569;
            color: #f8fafc;
        }

        /* 錄製：紅色（不要太亮） */
        .record-btn {
            background: #f97373;
            color: #fff5f5;
        }

        .record-btn.recording {
            background: #ef4444;
            animation: pulse 1.1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.55); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(239,68,68,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(15,23,42,0.18);
            opacity: 0.96;
        }

        /* 顯示設定：收合式，展開後放骨架/背景切換與軌跡多選 */
        .settings-toggle {
            display: block;
            width: 100%;
            max-width: 860px;
            margin: 0 auto 10px;
            border: none;
            border-radius: 12px;
            background: #eef2ff;
            color: #1e3a8a;
            font-size: 13px;
            font-weight: 600;
            padding: 9px 14px;
            cursor: pointer;
            text-align: center;
        }

        .settings-toggle:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .settings-chevron {
            display: inline-block;
            transition: transform 0.15s;
        }

        .settings-toggle[aria-expanded="true"] .settings-chevron {
            transform: rotate(180deg);
        }

        .settings-panel {
            max-width: 860px;
            margin: 0 auto 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
        }

        .settings-buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }

        .trace-select-title {
            font-size: 13px;
            font-weight: 600;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .trace-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 4px;
            font-size: 14px;
            color: #1f2937;
            cursor: pointer;
            border-bottom: 1px solid #e2e8f0;
        }

        .trace-option:last-child {
            border-bottom: none;
        }

        .trace-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1d4ed8;
        }

        .trace-swatch {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            margin: 10px 0 8px;
            background: #0f172a;
            border-radius: 14px;
            overflow: hidden;
            display: none;
        }

        #videoElement {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 純黑背景模式時把原始 video 元素藏起來，只留 canvas 的繪製結果 */
        .canvas-container.black-bg #videoElement {
            visibility: hidden;
        }

        #canvasElement {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .loading {
            text-align: center;
            color: #1d4ed8;
            font-size: 14px;
            margin: 6px 0 4px;
        }

        .error-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 12px;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 13px;
            display: none;
            white-space: pre-line;
        }

        /* 投擲次數顏色圖例 */
        .legend {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            padding: 8px 10px;
            background: #eef2ff;
            border-radius: 12px;
        }

        .legend.show {
            display: flex;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #334155;
        }

        .legend-swatch {
            width: 18px;
            height: 4px;
            border-radius: 2px;
        }

        .info {
            background: #e0ecff;
            padding: 10px 12px;
            border-radius: 14px;
            margin-top: 8px;
            font-size: 13px;
            color: #1f2937;
            line-height: 1.7;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .info-label {
            font-weight: 600;
        }

        .info-value {
            font-weight: 500;
            color: #1d4ed8;
        }

        /* 鏢次圖例：每一鏢一個色塊，對照畫面上的軌跡顏色。
           鏢數多時自動換行並靠右對齊，維持跟其他資訊列一樣的左標右值版面 */
        .throw-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 4px;
            min-width: 0;
        }

        .throw-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 1px 7px 1px 4px;
            border-radius: 999px;
            background: #eef2ff;
            font-size: 11px;
            font-weight: 600;
            color: #475569;
            line-height: 1.6;
        }

        /* 目前這一鏢：加深底色與外框，一眼看出畫面上正在長的是哪一條 */
        .throw-chip.current {
            background: #dbeafe;
            color: #1e3a8a;
            box-shadow: 0 0 0 1.5px #60a5fa;
        }

        .throw-swatch {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            /* 淺色色塊（例如黃、翠）在白底上邊界會糊掉，補一圈淡灰描邊 */
            box-shadow: 0 0 0 1px rgba(15,23,42,0.18);
            flex: 0 0 auto;
        }

        /* 還沒有任何一鏢時顯示的提示字 */
        .throw-legend-empty {
            color: #94a3b8;
            font-weight: 500;
        }

        /* 上方已有頁尾連結，跟共用樣式相比可以少留一點上方間距 */
        .copyright {
            margin-top: 12px;
        }

        /* 版本與更新日期：顏色略深，方便一眼確認載入的是不是最新版 */
        .version {
            color: #64748b;
            font-weight: 600;
        }

        .site-links {
            margin-top: 14px;
            text-align: center;
            font-size: 12px;
        }

        .site-links a {
            color: #3b82f6;
            text-decoration: none;
        }

        .site-links a:hover {
            text-decoration: underline;
        }

        .link-sep {
            color: #cbd5e1;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <!-- 共用版權資訊（姓名、當年年份），跟 privacy.html / sponsor.html 共用同一份 -->
    <script src="copyright.js"></script>

    <!-- 共用流量統計（Google Analytics 4）＋ Cookie 同意橫幅。
         評估 ID 設定在 analytics.js 裡，三頁共用同一份；
         未填 ID、或使用者未按下同意之前，都不會載入 GA、不會寫入任何 Cookie。 -->
    <script src="analytics.js"></script>

    <!-- 按鈕由 JS 依 SUPPORTED_LANGS / LANG_LABELS 產生。
         刻意放在 .container 外面、卡片正上方：跟卡片同寬、置中、靠右對齊，
         這樣語言鈕在白色卡片的外側，不會疊在卡片內容上面。 -->
    <div class="lang-switch" id="langSwitch"></div>

    <div class="container">
        <h1 data-i18n="appTitle">飛鏢投擲骨架分析器</h1>

        <!-- 主控制區：播放相關，常駐可見 -->
        <div class="controls" id="controls">
            <button class="control-btn upload-btn" id="uploadBtn">
                <span data-i18n="btn.upload">選擇影片</span>
            </button>
            <input type="file" id="fileInput" accept="video/*" style="display:none;" />

            <button class="control-btn play-btn" id="playPauseBtn" onclick="togglePlay()" disabled>播放</button>
            <button class="control-btn reset-btn" id="resetBtn" onclick="resetVideo()" disabled>
                <span data-i18n="btn.reset">重新播放</span>
            </button>
            <button class="control-btn record-btn" id="recordBtn" onclick="toggleRecording()" disabled>開始錄製</button>
        </div>

        <!-- 顯示設定：骨架/背景/軌跡，收合式，預設收起 -->
        <button
            class="settings-toggle"
            id="settingsToggleBtn"
            onclick="toggleSettingsPanel()"
            aria-expanded="false"
            aria-controls="settingsPanel"
            disabled
        >
            <span data-i18n="settings.toggle">顯示設定</span> <span class="settings-chevron" id="settingsChevron">▾</span>
        </button>

        <div class="settings-panel" id="settingsPanel" hidden>
            <div class="settings-buttons">
                <button class="control-btn toggle-btn" id="toggleSkeletonBtn" onclick="toggleSkeleton()">骨架：開</button>
                <button class="control-btn blackbg-btn" id="toggleBlackBgBtn" onclick="toggleBlackBg()">背景：影片</button>
            </div>

            <div class="trace-select">
                <div class="trace-select-title"><span data-i18n="trace.title">軌跡顯示</span> <span id="traceSummary">(4/4)</span></div>
                <label class="trace-option">
                    <input type="checkbox" id="traceCheckWrist" checked onchange="onTraceCheckboxChange('wrist', this)" />
                    <span class="trace-swatch" style="background: rgb(255,60,60)"></span>
                    <span data-i18n="trace.wrist">手腕</span>
                </label>
                <label class="trace-option">
                    <input type="checkbox" id="traceCheckElbow" checked onchange="onTraceCheckboxChange('elbow', this)" />
                    <span class="trace-swatch" style="background: rgb(140,255,120)"></span>
                    <span data-i18n="trace.elbow">手肘</span>
                </label>
                <label class="trace-option">
                    <input type="checkbox" id="traceCheckHead" checked onchange="onTraceCheckboxChange('head', this)" />
                    <span class="trace-swatch" style="background: rgb(255,215,70)"></span>
                    <span data-i18n="trace.head">頭部</span>
                </label>
                <label class="trace-option">
                    <input type="checkbox" id="traceCheckShoulder" checked onchange="onTraceCheckboxChange('shoulder', this)" />
                    <span class="trace-swatch" style="background: rgb(80,210,255)"></span>
                    <span data-i18n="trace.shoulder">肩膀</span>
                </label>
            </div>
        </div>

        <div id="loadingText" class="loading" style="display:none;">
            <span data-i18n="loading.model">正在載入骨架模型，請稍候...</span>
        </div>

        <div class="canvas-container" id="canvasContainer">
            <video id="videoElement" playsinline></video>
            <canvas id="canvasElement"></canvas>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <!-- 各列順序與上方按鈕一致，最後三列是沒有對應按鈕的系統資訊 -->
        <div class="info">
            <div class="info-row">
                <span class="info-label" data-i18n="info.playback">播放狀態：</span>
                <span class="info-value" id="statusPlayback">待機</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="info.background">背景模式：</span>
                <span class="info-value" id="statusBlackBg">影片</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="info.skeleton">骨架顯示：</span>
                <span class="info-value" id="statusSkeletonShow">開</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="info.wristTrace">手腕軌跡：</span>
                <span class="info-value" id="statusWristTrace">開</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="info.elbowTrace">手肘軌跡：</span>
                <span class="info-value" id="statusElbowTrace">開</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="info.headTrace">頭部軌跡：</span>
                <span class="info-value" id="statusHeadTrace">開</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="info.shoulderTrace">肩膀軌跡：</span>
                <span class="info-value" id="statusShoulderTrace">開</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="info.recording">錄製狀態：</span>
                <span class="info-value" id="statusRecording">關</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="info.hand">投擲手：</span>
                <span class="info-value" id="statusHand">自動判斷中</span>
            </div>
            <!-- 鏢次圖例：每一鏢一個色塊，對照畫面上的軌跡顏色。
                 色塊由 JS 依 THROW_COLORS 產生，不在這裡寫死顏色。 -->
            <div class="info-row">
                <span class="info-label" data-i18n="info.throws">鏢次顏色：</span>
                <span class="info-value throw-legend" id="throwLegend"></span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="info.model">骨架載入：</span>
                <span class="info-value" id="statusModel">載入中…</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-i18n="info.fps">目前幀率：</span>
                <span class="info-value" id="statusFPS">-- FPS</span>
            </div>
        </div>

        <!-- 頁尾連結：隱私權政策與贊助頁皆已開放（連結目的地頁面本身仍只有中文內容） -->
        <nav class="site-links" id="siteLinks">
            <a href="privacy.html" data-i18n="nav.privacy">隱私權政策</a>
            <span class="link-sep" id="sponsorSep">·</span>
            <a href="sponsor.html" id="sponsorLink" data-i18n="nav.sponsor">贊助支持</a>
        </nav>

        <footer class="copyright">
            <span class="version">
                <span data-i18n="footer.version">版本</span> <span id="versionNumber">v2.18</span>　<span data-i18n="footer.updated">最後更新</span> <span id="lastUpdated">2026-09-19 23:04</span>
            </span><br />
            <span data-i18n="footer.copyright">版權所有 © 2026 葉信男 YEH HSIN NAN．保留一切權利</span><br />
            <span data-i18n="footer.mediapipe">姿態辨識由 Google MediaPipe 提供（Apache License 2.0）</span>
        </footer>
    </div>

    <script type="module">
        // 匯入 MediaPipe Tasks Vision 中的 PoseLandmarker 與 FilesetResolver
        import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

        // === DOM 元素 ===
        const video = document.getElementById("videoElement");
        const canvas = document.getElementById("canvasElement");
        const ctx = canvas.getContext("2d");
        const canvasContainer = document.getElementById("canvasContainer");
        const loadingText = document.getElementById("loadingText");
        const errorMsg = document.getElementById("errorMsg");

        const uploadBtn = document.getElementById("uploadBtn");
        const fileInput = document.getElementById("fileInput");
        const playPauseBtn = document.getElementById("playPauseBtn");
        const resetBtn = document.getElementById("resetBtn");
        const toggleSkeletonBtn = document.getElementById("toggleSkeletonBtn");
        const toggleBlackBgBtn = document.getElementById("toggleBlackBgBtn");
        const recordBtn = document.getElementById("recordBtn");

        const settingsToggleBtn = document.getElementById("settingsToggleBtn");
        const settingsPanel = document.getElementById("settingsPanel");
        const settingsChevron = document.getElementById("settingsChevron");
        const traceSummary = document.getElementById("traceSummary");
        const traceCheckboxes = {
            wrist: document.getElementById("traceCheckWrist"),
            elbow: document.getElementById("traceCheckElbow"),
            head: document.getElementById("traceCheckHead"),
            shoulder: document.getElementById("traceCheckShoulder")
        };

        const statusPlayback = document.getElementById("statusPlayback");
        const statusModel = document.getElementById("statusModel");
        const statusSkeletonShow = document.getElementById("statusSkeletonShow");
        const statusWristTrace = document.getElementById("statusWristTrace");
        const statusElbowTrace = document.getElementById("statusElbowTrace");

        function loadSavedLang() {
            try {

        function t(key, vars) {

            if (!entry) {
                console.warn("i18n missing key:", key);
                return key;

            let text = entry[currentLang] || entry.zh;
            // {year} 一律可用，來源是 copyright.js 設的 window.SITE_COPYRIGHT；

            const yearFallback = window.SITE_COPYRIGHT ? window.SITE_COPYRIGHT.year : new Date().getFullYear();

            for (const k in mergedVars) text = text.replace(`{${k}}`, mergedVars[k]);
            return text;
        }

        let playbackStateKey = "idle"; // idle | loadingVideo | playing | paused | ended
        let modelStatusKey = "loading"; // loading | loaded
        let lastRecordFormatLabel = null;

        // MediaPipe Pose 關鍵點索引
        const LEFT_WRIST = 15;
        const RIGHT_WRIST = 16;
        // 手臂關鍵點（手肘、手腕）移動最快、偵測最不穩，需要較強的濾波
        const FAST_LIMB_INDICES = new Set([13, 14, 15, 16]);

        // 低於此可信度的關鍵點視為不可靠，不繪製也不納入軌跡
        const MIN_VISIBILITY_DRAW = 0.35;
        const MIN_VISIBILITY_TRACE = 0.3;

        // 單次偵測間，關鍵點在正規化座標中不可能超過的位移量（超過視為誤判）
        const MAX_JUMP_PER_DETECT = 0.22;
        const MAX_CONSECUTIVE_REJECTS = 3;

        // === 平滑濾波：中位數去尖刺 + One Euro Filter 時間平滑（固定啟用） ===
        const MEDIAN_WINDOW = 5;
        const rawHistoryX = new Map();
        const rawHistoryY = new Map();

        function medianOf(arr) {
            const s = [...arr].sort((a, b) => a - b);
            return s[Math.floor(s.length / 2)];
        }

        function medianFilterPoint(idx, x, y) {
            let hx = rawHistoryX.get(idx);
            let hy = rawHistoryY.get(idx);
            if (!hx) { hx = []; rawHistoryX.set(idx, hx); }
            if (!hy) { hy = []; rawHistoryY.set(idx, hy); }

            hx.push(x);
            hy.push(y);
            if (hx.length > MEDIAN_WINDOW) hx.shift();
            if (hy.length > MEDIAN_WINDOW) hy.shift();

            if (hx.length < 3) return { x, y };
            return { x: medianOf(hx), y: medianOf(hy) };
        }

        function makeFilterParams(idx) {
            if (FAST_LIMB_INDICES.has(idx)) {
                // 手肘/手腕：beta 決定「動得越快、濾波越弱」的自適應強度。
                // 曾經為了壓抖動把 beta 降到 0.05，等於關掉自適應，
                // 出手這種高速動作的延遲一度到 667ms，肉眼明顯慢一拍。
                // 目前參數量測延遲約 67ms（2 幀，已接近偵測本身 30fps 的物理下限），
                // 換來的代價是靜止時抖動從 2.6px 升到 3.6px（720p），仍在骨架點半徑 7px 內。
                // 跳點是靠離群值拒絕與中位數濾波處理的，不該由 beta 承擔。
                return { minCutoff: 2.0, beta: 2.5, dCutoff: 1.0 };
            }
            return { minCutoff: 0.8, beta: 0.2, dCutoff: 1.0 };
        }

        function lowPassAlpha(cutoff, dt) {
            const tau = 1.0 / (2 * Math.PI * cutoff);
            return 1.0 / (1.0 + tau / dt);
        }

        class OneEuroFilter1D {
            constructor({ minCutoff, beta, dCutoff }) {
                this.minCutoff = minCutoff;
                this.beta = beta;
                this.dCutoff = dCutoff;
                this.xPrev = null;
                this.dxPrev = 0;
                this.tPrev = null;
            }
            filter(x, t) {
                if (this.tPrev === null) {
                    this.tPrev = t;
                    this.xPrev = x;
                    this.dxPrev = 0;
                    return x;
                }
                const dt = Math.max((t - this.tPrev) / 1000, 1 / 240);
                this.tPrev = t;

                const dx = (x - this.xPrev) / dt;
                const aD = lowPassAlpha(this.dCutoff, dt);
                const dxHat = aD * dx + (1 - aD) * this.dxPrev;

                const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
                const a = lowPassAlpha(cutoff, dt);
                const xHat = a * x + (1 - a) * this.xPrev;

                this.xPrev = xHat;
                this.dxPrev = dxHat;
                return xHat;
            }
        }

        const landmarkFiltersX = new Map();
        const landmarkFiltersY = new Map();

        function getFilter(map, idx) {
            let f = map.get(idx);
            if (!f) {
                f = new OneEuroFilter1D(makeFilterParams(idx));
                map.set(idx, f);
            }
            return f;
        }

        // 離群點拒絕用的前次可信位置
        const lastAcceptedPoint = new Map();
        const rejectCount = new Map();

        function resetSmoothing() {
            landmarkFiltersX.clear();
            landmarkFiltersY.clear();
            rawHistoryX.clear();
            rawHistoryY.clear();
            lastAcceptedPoint.clear();
            rejectCount.clear();
        }

        function rejectOutlier(idx, x, y) {
            const prev = lastAcceptedPoint.get(idx);
            if (!prev) {
                lastAcceptedPoint.set(idx, { x, y });
                rejectCount.set(idx, 0);
                return { x, y };
            }
            const dist = Math.hypot(x - prev.x, y - prev.y);
            const rejects = rejectCount.get(idx) || 0;

            if (dist > MAX_JUMP_PER_DETECT && rejects < MAX_CONSECUTIVE_REJECTS) {
                rejectCount.set(idx, rejects + 1);
                return prev;
            }
            rejectCount.set(idx, 0);
            lastAcceptedPoint.set(idx, { x, y });
            return { x, y };
        }

        function smoothLandmarks(landmarks, t) {
            return landmarks.map((lm, i) => {
                if (!lm) return lm;
                const cleaned = rejectOutlier(i, lm.x, lm.y);
                const med = medianFilterPoint(i, cleaned.x, cleaned.y);
                const fx = getFilter(landmarkFiltersX, i);
                const fy = getFilter(landmarkFiltersY, i);
                return {
                    x: fx.filter(med.x, t),
                    y: fy.filter(med.y, t),
                    z: lm.z,
                    visibility: lm.visibility
                };
            });
        }

        // === 軌跡：手腕（紅）／頭部（黃）／肩膀（青），三條各自獨立開關 ===
        //
        // 用途差異：
        //   手腕 — 看出手路徑是否一致
        //   頭部、肩膀 — 投擲時這兩處應該幾乎不動，軌跡越短越集中代表動作越穩定，
        //                所以除了畫線，還會即時算出移動幅度給使用者參考
        const MAX_TRACE_POINTS = 800;        // 保留夠長的軌跡，不會中途消失
        const MIN_TRACE_SPACING = 0.004;     // 幾乎沒動就不重複記錄

        // 關鍵點索引
        const WRIST_INDEX = { left: 15, right: 16 };
        const ELBOW_INDEX = { left: 13, right: 14 };
        const SHOULDER_INDEX = { left: 11, right: 12 };
        const EAR_INDEX = { left: 7, right: 8 };
        const EYE_INDEX = { left: 2, right: 5 };
        const MOUTH_INDEX = { left: 9, right: 10 };
        const NOSE_INDEX = 0;

        // 頭部代表點的高度。
        //
        // 原本是用耳朵往上推估「頭頂」，但實際使用時頭頂點偏高、離身體太遠，
        // 改成直接取「眼睛高度」——眼睛是臉上最穩定也最好認的位置，
        // 而且不需要推估，少一層誤差來源。
        //
        // 想再調高或調低就改這個數字（單位是臉部尺寸，也就是眼到嘴的距離）：
        //   0    ＝ 眼睛高度（目前）
        //   0.5  ＝ 額頭附近
        //   1.35 ＝ 舊版的頭頂位置
        // 正值往上（正規化座標的 y 軸向下增加，所以程式裡是減法）。
        const HEAD_POINT_RAISE = 0;

        function isVisible(lm) {
            return lm && (lm.visibility == null || lm.visibility >= MIN_VISIBILITY_DRAW);
        }

        function midPoint(a, b) {
            const pts = [a, b].filter(isVisible);
            if (!pts.length) return null;
            if (pts.length === 1) return pts[0];
            return {
                x: (pts[0].x + pts[1].x) / 2,
                y: (pts[0].y + pts[1].y) / 2,
                visibility: Math.min(
                    pts[0].visibility != null ? pts[0].visibility : 1,
                    pts[1].visibility != null ? pts[1].visibility : 1
                )
            };
        }

        // 頭部尺寸尺規：用「眼到嘴」的垂直距離。
        // 頭左右轉動時這個距離幾乎不變，但眼到耳的距離會因為看到側臉輪廓而暴增
        // （側面約正面的兩倍），拿它當尺規會讓側面拍攝時的頭頂點飛得太高。
        function faceScale(landmarks) {
            const eye = midPoint(landmarks[EYE_INDEX.left], landmarks[EYE_INDEX.right]);
            const mouth = midPoint(landmarks[MOUTH_INDEX.left], landmarks[MOUTH_INDEX.right]);
            if (!eye || !mouth) return null;
            return Math.abs(mouth.y - eye.y);
        }

        // 頭部的代表點：軌跡與骨架上的頭部點、頸線都用這一個點。
        // 以眼睛為基準，看不到眼睛時依序退回耳朵、鼻子，避免整顆頭消失。
        function computeHeadPoint(landmarks) {
            const base =
                midPoint(landmarks[EYE_INDEX.left], landmarks[EYE_INDEX.right]) ||
                midPoint(landmarks[EAR_INDEX.left], landmarks[EAR_INDEX.right]) ||
                (isVisible(landmarks[NOSE_INDEX]) ? landmarks[NOSE_INDEX] : null);

            if (!base) return null;
            if (!HEAD_POINT_RAISE) return base;

            // 要往上位移時才需要尺規。取臉部尺寸而不是肩寬：
            // 肩膀晃動時不會連帶汙染頭部穩定度的量測。
            const scale = faceScale(landmarks);
            if (!scale) return base;

            return {
                x: base.x,
                y: base.y - scale * HEAD_POINT_RAISE,
                visibility: base.visibility != null ? base.visibility : 0.8
            };
        }

        // === 軌跡配色：依「第幾鏢」上色，不是依部位 ===
        //
        // 目的是比較每一鏢之間的差異：同一鏢的手腕、手肘、頭部、肩膀共用一個顏色，
        // 下一鏢換下一個顏色，疊在同一張畫面上就能看出每次出手的落差。
        // 部位靠所在位置區分（手腕畫得最遠、頭部在最上方），不靠顏色。
        //
        // 選色原則：9 色的色相平均分布在色環上（每 40 度一個），彼此最容易分辨；
        // 亮度則逐色微調，確保在純黑背景上的對比都在 6:1 以上——
        // 黃綠區人眼最敏感所以壓低一點，藍紫區天生偏暗所以拉高，
        // 否則純藍在黑底上會暗到看不清楚。
        // 調整顏色時請一併確認色相間距與黑底對比，不要只憑肉眼挑。
        const THROW_COLORS = [
            "251,86,86",     // 紅    0°
            "250,185,56",    // 橘   40°
            "185,250,56",    // 黃   80°
            "56,250,56",     // 綠  120°
            "56,250,185",    // 翠  160°
            "86,196,251",    // 青  200°
            "126,126,252",   // 藍  240°
            "210,126,252",   // 紫  280°
            "251,86,196"     // 桃  320°
        ];

        // 目前是第幾鏢。每次手腕重新舉過手肘就 +1，決定該鏢的顏色。
        // 顏色索引存在每一段裡（不是靠陣列位置算），所以即使舊的段因為
        // 點數上限被丟掉，剩下的段顏色也不會跟著位移。
        let throwIndex = 0;

        // throwIndex 從 1 起算（第 1 鏢、第 2 鏢……，跟人的講法一致），
        // 所以查表時要減 1，第 1 鏢才會拿到調色盤的第一個顏色
        function throwColor(index) {
            return THROW_COLORS[(index - 1) % THROW_COLORS.length];
        }

        // 軌跡以「段」為單位保存，一段就是一鏢。
        // 如果全部點擠在同一個陣列裡，中斷前後會被連成一條實際上不存在的直線
        // （從上一段結尾直接拉到新段起點），分段就是為了避免這件事。
        function createTrace(enabled) {
            return { segments: [], enabled };
        }

        function clearTrace(trace) {
            trace.segments.length = 0;
        }

        // 取得目前這一鏢的段；還不存在就建一個。
        // 段自己記住是第幾鏢，顏色因此不會隨陣列位置改變。
        function currentSegment(trace) {
            const last = trace.segments[trace.segments.length - 1];
            if (last && last.throwIndex === throwIndex) return last;

            const seg = { throwIndex, points: [] };
            trace.segments.push(seg);
            return seg;
        }

        function tracePointCount(trace) {
            let n = 0;
            for (const seg of trace.segments) n += seg.points.length;
            return n;
        }

        const traces = {
            wrist: createTrace(true),
            elbow: createTrace(true),
            head: createTrace(true),
            shoulder: createTrace(true)
        };

        function createHandState() {
            return { moveAmount: 0, prevPoint: null };
        }

        const handStates = {
            left: createHandState(),
            right: createHandState()
        };

        // 投擲手：取累積移動量較大的那隻手，只畫它的軌跡，畫面才不會被另一手干擾
        let dominantHand = null;

        function clearAllTraces() {
            for (const key of Object.keys(traces)) {
                clearTrace(traces[key]);
            }
            handStates.left = createHandState();
            handStates.right = createHandState();
            dominantHand = null;
            accumulating = false;
            throwStarted = false;
            throwIndex = 0;
            statusHand.textContent = t("hand.auto");
            updateTraceStatus();
        }

        function pushTracePoint(trace, lm) {
            if (!lm) return;
            if (lm.visibility != null && lm.visibility < MIN_VISIBILITY_TRACE) return;

            const seg = currentSegment(trace);

            const last = seg.points[seg.points.length - 1];
            if (last) {
                const d = Math.hypot(lm.x - last.x, lm.y - last.y);
                if (d < MIN_TRACE_SPACING) return;
            }
            seg.points.push({ x: lm.x, y: lm.y });

            // 總點數上限：從最舊的一段開始丟，整段空掉就把那一段移除
            if (tracePointCount(trace) > MAX_TRACE_POINTS) {
                const first = trace.segments[0];
                first.points.shift();
                if (!first.points.length) trace.segments.shift();
            }
        }

        // 累積該手的移動量，供投擲手判定
        function accumulateMovement(state, lm) {
            if (!lm) return;
            if (lm.visibility != null && lm.visibility < MIN_VISIBILITY_TRACE) return;
            if (state.prevPoint) {
                state.moveAmount += Math.hypot(lm.x - state.prevPoint.x, lm.y - state.prevPoint.y);
            }
            state.prevPoint = { x: lm.x, y: lm.y };
        }

        // 手腕、手肘、肩膀都畫投擲手那一側；換手時這三條要一起丟棄重來
        const HAND_DEPENDENT_TRACES = ["wrist", "elbow", "shoulder"];

        // 影片剛開始時兩手的累積移動量都接近 0，單純比大小會在兩邊反覆跳，
        // 軌跡就會一直被清空。所以一旦定了投擲手，要另一手明顯動得更多才改判。
        const DOMINANT_SWITCH_MARGIN = 1.25;

        // === 出手偵測：軌跡從「手腕第一次高過手肘」那一刻才開始畫 ===
        //
        // 準備階段（拿鏢、垂手、調整站位）手腕大多低於手肘且到處晃，
        // 那段路徑對動作分析沒有意義，畫出來只會讓畫面糊成一團。
        // 把鏢舉起來、手腕升過手肘高度，才算真正進入投擲動作。
        //
        // 用高度（垂直）而不是前後（水平）判斷的好處是不必知道人面向哪一邊，
        // 所以側面拍攝面向左或右都成立，正面拍攝也一樣能用。
        //
        // 注意座標系：正規化座標的 y 軸**向下增加**（畫面頂端是 0），
        // 所以「手腕高於手肘」寫成 wrist.y < elbow.y，不是大於。
        // 開始與停止用不同門檻（遲滯）。若兩者相同，手腕剛好停在手肘高度附近時
        // 會在「累積／不累積」之間每幀反覆切換，軌跡被切成一堆碎片。
        //   開始：要明確高過手肘 0.02 才起算
        //   停止：一路到低於手肘高度（0）才停
        const THROW_START_MARGIN = 0.02;
        const THROW_STOP_MARGIN = 0;

        // 目前是否正在累積（手腕在手肘之上）
        let accumulating = false;
        // 是否曾經累積過，只用來決定狀態列要顯示「等待出手」還是「偵測中」
        let throwStarted = false;

        // 手腕高於手肘多少（正規化座標）。y 軸向下增加，所以是 elbow.y - wrist.y。
        // 關鍵點看不到時回傳 null，代表無法判斷
        function wristHeightAboveElbow(landmarks, hand) {
            const wrist = landmarks[WRIST_INDEX[hand]];
            const elbow = landmarks[ELBOW_INDEX[hand]];
            if (!isVisible(wrist) || !isVisible(elbow)) return null;

            return elbow.y - wrist.y;
        }

        function decideDominantHand() {
            const right = handStates.right.moveAmount;
            const left = handStates.left.moveAmount;
            if (dominantHand === null) return right >= left ? "right" : "left";

            const current = handStates[dominantHand].moveAmount;
            const other = dominantHand === "right" ? left : right;
            if (other > current * DOMINANT_SWITCH_MARGIN) {
                return dominantHand === "right" ? "left" : "right";
            }
            return dominantHand;
        }

        function updateTraces(landmarks) {
            if (!landmarks || !Array.isArray(landmarks)) return;

            const leftWrist = landmarks[WRIST_INDEX.left];
            const rightWrist = landmarks[WRIST_INDEX.right];
            accumulateMovement(handStates.left, leftWrist);
            accumulateMovement(handStates.right, rightWrist);

            const hand = decideDominantHand();
            if (hand !== dominantHand) {
                // 換手代表先前累積的是另一隻手的軌跡，必須整條丟掉，
                // 否則畫面上會從對側拉一條長線過來（頭部不依賴投擲手，所以不受影響）
                dominantHand = hand;
                statusHand.textContent = hand === "right" ? t("hand.right") : t("hand.left");
                for (const key of HAND_DEPENDENT_TRACES) clearTrace(traces[key]);

                // 先前的判定是根據另一隻手做的，換手後一律重新開始
                accumulating = false;
                throwStarted = false;
            }

            // 只在「手腕高於手肘」期間累積軌跡，低於手肘就停止。
            // 注意這段放在移動量累積與投擲手判定「之後」——
            // 那兩件事必須全程進行，否則等到手舉起來時還來不及判斷是哪隻手。
            const height = wristHeightAboveElbow(landmarks, hand);
            if (height === null) {
                // 手腕或手肘看不到，無法判斷。維持現狀不做切換，
                // 但也不累積這一幀，免得把錯誤位置畫進去
                updateTraceStatus();
                return;
            }

            const wasAccumulating = accumulating;
            accumulating = accumulating
                ? height > THROW_STOP_MARGIN
                : height > THROW_START_MARGIN;

            if (!accumulating) {
                updateTraceStatus();
                return;
            }

            // 由「停」轉「累積」＝新的一鏢開始：換下一個顏色。
            // 各條軌跡的段會在下次 pushTracePoint 時自己依這個編號建立，
            // 所以四條線的鏢次與顏色天生對齊，不必額外同步。
            if (!wasAccumulating) throwIndex++;

            throwStarted = true;

            // 手肘與肩膀都追蹤投擲手同側，方便和手臂動作直接對照
            if (traces.wrist.enabled) {
                pushTracePoint(traces.wrist, hand === "right" ? rightWrist : leftWrist);
            }
            if (traces.elbow.enabled) {
                pushTracePoint(traces.elbow, landmarks[ELBOW_INDEX[hand]]);
            }
            if (traces.head.enabled) {
                pushTracePoint(traces.head, computeHeadPoint(landmarks));
            }
            if (traces.shoulder.enabled) {
                pushTracePoint(traces.shoulder, landmarks[SHOULDER_INDEX[hand]]);
            }

            updateTraceStatus();
        }

        // 移動幅度＝軌跡點涵蓋範圍的對角線長度（正規化座標），轉成畫面百分比
        function traceSpread(trace) {
            if (tracePointCount(trace) < 2) return 0;
            let minX = 1, maxX = 0, minY = 1, maxY = 0;
            // 涵蓋範圍跨所有段一起算：中斷只是「這段時間沒在記錄」，
            // 不代表要分開評估穩定度
            for (const seg of trace.segments) {
                for (const p of seg.points) {
                    if (p.x < minX) minX = p.x;
                    if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y;
                    if (p.y > maxY) maxY = p.y;
                }
            }
            return Math.hypot(maxX - minX, maxY - minY);
        }

        function spreadPercent(spread) {
            return (spread * 100).toFixed(1) + "%";
        }

        // 頭、肩、手肘在投擲時都應該幾乎不動（手肘是前臂鐘擺的支點），所以給穩定度評語。
        // 門檻為初步估值，實測後可再調整。
        function stabilityLabel(spread) {
            const pct = spreadPercent(spread);
            if (spread < 0.02) return t("trace.status.stable", { pct });
            if (spread < 0.05) return t("trace.status.slight", { pct });
            return t("trace.status.moving", { pct });
        }

        function traceStatusText(trace, labelFn) {
            if (!trace.enabled) return t("state.off");
            // 明確區分「還沒出手所以沒有軌跡」與「已出手但點數還不夠」，
            // 否則使用者會以為是偵測壞掉
            if (!throwStarted) return t("trace.status.waiting");
            if (tracePointCount(trace) < 2) return t("trace.status.detecting");
            return labelFn(traceSpread(trace));
        }

        // 圖例只列出「畫面上真的還看得到」的鏢次。
        // 軌跡有點數上限，最舊的段會被丟掉，那些鏢就不該繼續留在圖例裡。
        // 四條軌跡的鏢次一致，但使用者可能只開其中幾條，所以取聯集。
        function visibleThrowIndexes() {
            const seen = new Set();
            for (const key of Object.keys(traces)) {
                const trace = traces[key];
                if (!trace.enabled) continue;
                for (const seg of trace.segments) {
                    if (seg.points.length) seen.add(seg.throwIndex);
                }
            }
            return [...seen].sort((a, b) => a - b);
        }

        function updateThrowLegend() {
            const indexes = visibleThrowIndexes();
            throwLegendEl.innerHTML = "";

            if (!indexes.length) {
                const empty = document.createElement("span");
                empty.className = "throw-legend-empty";
                empty.textContent = t("legend.empty");
                throwLegendEl.appendChild(empty);
                return;
            }

            for (const index of indexes) {
                const chip = document.createElement("span");
                chip.className = "throw-chip";
                // 正在累積中的那一鏢才算「目前」；手放下之後就不再標示
                if (accumulating && index === throwIndex) chip.classList.add("current");

                const swatch = document.createElement("span");
                swatch.className = "throw-swatch";
                swatch.style.background = `rgb(${throwColor(index)})`;

                const label = document.createElement("span");
                label.textContent = t("legend.throw", { n: index });

                chip.appendChild(swatch);
                chip.appendChild(label);
                throwLegendEl.appendChild(chip);
            }
        }

        function updateTraceStatus() {
            updateThrowLegend();
            // 手腕本來就該大幅移動，只報範圍不做穩定度評價
            statusWristTrace.textContent = traceStatusText(
                traces.wrist,
                (s) => t("trace.status.wristRange", { pct: spreadPercent(s) })
            );
            statusElbowTrace.textContent = traceStatusText(traces.elbow, stabilityLabel);
            statusHeadTrace.textContent = traceStatusText(traces.head, stabilityLabel);
            statusShoulderTrace.textContent = traceStatusText(traces.shoulder, stabilityLabel);
        }

        // 畫所有已開啟的軌跡：固定顏色與粗細，不淡出、不消失
        // 手腕最後畫，確保疊在最上層
        function drawTraces() {
            for (const key of ["head", "shoulder", "elbow", "wrist"]) {
                if (traces[key].enabled) drawTraceLine(traces[key]);
            }
        }

        // 出手瞬間手腕移動極快，一幀只能取到一個點，相鄰兩點在畫面上可能隔很遠，
        // 直接連線看起來就是一條生硬的直線。這裡改用 Catmull-Rom 曲線插值：
        // 曲線會通過每一個實際偵測點，中間依前後鄰點的走向補出圓滑的路徑。
        //
        // 必須誠實理解它的極限：插值只是讓「畫出來的線」順，
        // 並沒有還原沒被拍到的動作。要真的看到更多細節，只能提高拍攝幀率。
        // 而且一段只有兩個點時沒有鄰點可參考，畫出來仍然是直線。
        const TRACE_SAMPLE_PX = 6;     // 每隔約幾個畫素補一個插值點
        const TRACE_MAX_STEPS = 16;    // 單一區間的插值上限，避免極端點距拖慢繪製

        function catmullRom(p0, p1, p2, p3, t) {
            const t2 = t * t;
            const t3 = t2 * t;
            return {
                x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t +
                    (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                    (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
                y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t +
                    (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                    (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
            };
        }

        function drawTraceLine(trace) {
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.lineWidth = 4;

            // 每一段是一鏢，各自獨立一筆、各自的顏色，段與段之間不連線
            for (const seg of trace.segments) {
                drawTraceSegment(seg);
            }
        }

        function drawTraceSegment(seg) {
            const pts = seg.points;
            if (pts.length < 2) return;

            ctx.strokeStyle = `rgba(${throwColor(seg.throwIndex)},0.9)`;
            ctx.beginPath();
            ctx.moveTo(pts[0].x * canvas.width, pts[0].y * canvas.height);

            if (pts.length === 2) {
                ctx.lineTo(pts[1].x * canvas.width, pts[1].y * canvas.height);
                ctx.stroke();
                return;
            }

            for (let i = 0; i < pts.length - 1; i++) {
                // 頭尾沒有鄰點時用自己代替，曲線端點才不會往外飛
                const p0 = pts[i - 1] || pts[i];
                const p1 = pts[i];
                const p2 = pts[i + 1];
                const p3 = pts[i + 2] || p2;

                // 插值密度跟著點距走：手快、點距大就補得密，
                // 手慢、點距小就少補幾點，不浪費繪製成本
                const dx = (p2.x - p1.x) * canvas.width;
                const dy = (p2.y - p1.y) * canvas.height;
                const steps = Math.max(
                    1,
                    Math.min(TRACE_MAX_STEPS, Math.round(Math.hypot(dx, dy) / TRACE_SAMPLE_PX))
                );

                for (let s = 1; s <= steps; s++) {
                    const q = catmullRom(p0, p1, p2, p3, s / steps);
                    ctx.lineTo(q.x * canvas.width, q.y * canvas.height);
                }
            }
            ctx.stroke();
        }

        // === FPS 計算相關 ===
        const frameTimes = [];
        let lastFPSUpdate = 0;

        let lastLandmarks = null;

        // === 共用 UI 函式 ===
        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = "block";
        }

        function hideError() {
            errorMsg.textContent = "";
            errorMsg.style.display = "none";
        }

        function setPlaybackState(key) {
            playbackStateKey = key;
            statusPlayback.textContent = t("playback." + key);
        }

        // === 初始化 MediaPipe Pose 模型 ===
        async function initPoseLandmarker() {
            loadingText.style.display = "block";
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );
                poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        // full 模型：手臂快速揮動時的關鍵點精度明顯優於 lite
                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 1,
                    minPoseDetectionConfidence: 0.6,
                    minPosePresenceConfidence: 0.6,
                    minTrackingConfidence: 0.6
                });
                modelReady = true;
                loadingText.style.display = "none";
                modelStatusKey = "loaded";
                statusModel.textContent = t("model.loaded");
            } catch (e) {
                loadingText.style.display = "none";
                showError(t("error.mediapipeInitFailed") + e.message);
                console.error(e);
            }
        }

        function clearCanvas() {
            if (!canvas.width || !canvas.height) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function stopDetectLoop() {
            detecting = false;
            if (rvfcId !== null && typeof video.cancelVideoFrameCallback === "function") {
                video.cancelVideoFrameCallback(rvfcId);
            }
            rvfcId = null;
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
            }
            rafId = null;
        }

        function startDetectLoop() {
            if (detecting) return;
            if (video.paused || video.ended) return;
            detecting = true;
            if (hasRVFC) {
                rvfcId = video.requestVideoFrameCallback(onVideoFrame);
            } else {
                rafId = requestAnimationFrame(onAnimationFrame);
            }
        }

        function onVideoFrame() {
            processFrame();
            if (detecting && !video.paused && !video.ended) {
                rvfcId = video.requestVideoFrameCallback(onVideoFrame);
            } else {
                detecting = false;
            }
        }

        function onAnimationFrame() {
            processFrame();
            if (detecting && !video.paused && !video.ended) {
                rafId = requestAnimationFrame(onAnimationFrame);
            } else {
                detecting = false;
            }
        }

        function updateFPS(now) {
            frameTimes.push(now);
            while (frameTimes.length && frameTimes[0] <= now - 1000) {
                frameTimes.shift();
            }
            const fps = frameTimes.length;
            if (now - lastFPSUpdate > 200) {
                statusFPS.textContent = fps.toFixed(0) + " FPS";
                lastFPSUpdate = now;
            }
        }

        // 單幀處理：畫背景 + 骨架偵測 + 繪製
        function processFrame() {
            const now = performance.now();
            updateFPS(now);

            // 1. 畫背景：影片畫面，或純黑
            if (blackBgEnabled) {
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                try {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                } catch (e) {
                    // 影片剛開始可能尚無 frame
                }
            }

            if (!poseLandmarker || !modelReady) return;

            try {
                // 2. 每個新影片幀都做一次偵測，避免節流造成的階梯式跳動。
                //    偵測永遠執行、不受「骨架顯示」開關影響 —— 軌跡需要持續拿到新座標
                //    才能一直畫下去；骨架開關只決定要不要疊上骨架線段，兩者互不相干。
                const result = poseLandmarker.detectForVideo(video, now);
                if (result.landmarks && result.landmarks.length > 0) {
                    lastLandmarks = smoothLandmarks(result.landmarks[0], now);
                    // 3. 軌跡只在拿到新偵測結果時累積
                    updateTraces(lastLandmarks);
                }

                drawTraces();
                if (skeletonEnabled && lastLandmarks) drawSkeleton(lastLandmarks);
            } catch (e) {
                console.error("detectForVideo 錯誤:", e);
            }
        }

        // 畫骨架線段與節點
        function drawSkeleton(landmarks) {
            if (!landmarks || !Array.isArray(landmarks)) return;

            const connections = [
                [11, 12], [11, 23], [12, 24], [23, 24],
                [11, 13], [13, 15], [12, 14], [14, 16],
                [23, 25], [25, 27], [27, 29], [29, 31],
                [24, 26], [26, 28], [28, 30], [30, 32]
            ];

            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineCap = "round";

            for (const [s, e] of connections) {
                const a = landmarks[s];
                const b = landmarks[e];
                if (!isVisible(a) || !isVisible(b)) continue;
                ctx.beginPath();
                ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
                ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
                ctx.stroke();
            }

            // 頭部只用一個代表點（眼睛高度），並拉一條「頸線」連到兩肩中點
            const headTop = computeHeadPoint(landmarks);
            const neck = midPoint(landmarks[SHOULDER_INDEX.left], landmarks[SHOULDER_INDEX.right]);
            if (headTop && neck) {
                ctx.strokeStyle = "rgba(255,255,255,0.9)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(neck.x * canvas.width, neck.y * canvas.height);
                ctx.lineTo(headTop.x * canvas.width, headTop.y * canvas.height);
                ctx.stroke();
            }

            for (let i = 0; i < landmarks.length; i++) {
                if (i <= 10) continue;            // 0–10 為臉部，改用單一頭頂點代表
                if (i >= 17 && i <= 22) continue; // 17–22 為手指節點
                const lm = landmarks[i];
                if (!isVisible(lm)) continue;
                drawJoint(lm.x, lm.y, lm.visibility != null ? lm.visibility : 0.8);
            }

            if (headTop) drawJoint(headTop.x, headTop.y, headTop.visibility);
        }

        function drawJoint(nx, ny, alpha) {
            const x = nx * canvas.width;
            const y = ny * canvas.height;

            ctx.beginPath();
            ctx.fillStyle = `rgba(255,0,0,${alpha})`;
            ctx.arc(x, y, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // === 錄製：把 canvas 畫面（影片 + 骨架 + 軌跡）另存成影片檔 ===
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordingStarting = false;

        // 優先產出 MP4（FB / IG 只吃得下 MP4），H.264 排最前面。
        // MP4 容器若包 VP9 編碼，副檔名雖然是 .mp4，社群平台仍可能拒收或要求轉檔，
        // 所以明確指定 avc1 的選項排在只寫 "video/mp4" 之前。
        const RECORD_MIME_CANDIDATES = [
            "video/mp4;codecs=avc1.42E01E", // H.264 baseline，相容性最好
            "video/mp4;codecs=avc1.4d002a", // H.264 main
            "video/mp4;codecs=avc1",
            "video/mp4",                    // 容器是 MP4，編碼由瀏覽器決定
            "video/webm;codecs=vp9",
            "video/webm;codecs=vp8",
            "video/webm"
        ];

        const RECORD_BITRATE = 5000000;
        let verifiedMimeType = null; // 探測結果只算一次，之後重複使用

        // MediaRecorder.isTypeSupported() 會對某些格式回報 true，實際卻錄不出任何位元組
        // （實測 Chrome 152 要求 avc1.42E01E 時產出 0 bytes 的壞檔）。
        // 因此正式錄製前，先用離屏 canvas 實錄 0.3 秒確認真的有資料產出。
        function canActuallyRecord(mimeType) {
            return new Promise((resolve) => {
                let timer = null;
                try {
                    const probe = document.createElement("canvas");
                    probe.width = 64;
                    probe.height = 64;
                    const pctx = probe.getContext("2d");
                    const stream = probe.captureStream(30);
                    const rec = new MediaRecorder(stream, {
                        mimeType,
                        videoBitsPerSecond: RECORD_BITRATE
                    });

                    let bytes = 0;
                    rec.ondataavailable = (e) => { bytes += e.data ? e.data.size : 0; };
                    rec.onerror = () => {};
                    rec.onstop = () => {
                        clearInterval(timer);
                        stream.getTracks().forEach((t) => t.stop());
                        resolve(bytes > 0);
                    };

                    // 一定要帶 timeslice，條件才和正式錄製一致。
                    // 不帶的話資料只在 stop 時產生，H.264 首次初始化來不及 flush 就會量到 0 bytes，
                    // 導致明明可用的 MP4 被誤判成不支援而退回 WebM。
                    rec.start(100);
                    // 畫面必須持續變動，靜止的 canvas 不會產生新的視訊幀
                    let flip = false;
                    timer = setInterval(() => {
                        flip = !flip;
                        pctx.fillStyle = flip ? "#ffffff" : "#000000";
                        pctx.fillRect(0, 0, 64, 64);
                    }, 30);
                    setTimeout(() => {
                        try { rec.stop(); } catch (e) { clearInterval(timer); resolve(false); }
                    }, 300);
                } catch (e) {
                    clearInterval(timer);
                    resolve(false);
                }
            });
        }

        // 讓使用者一眼看出錄出來的檔案能不能直接上傳社群平台
        function recordFormatLabel(mimeType) {
            if (!mimeType.includes("mp4")) return "WebM";
            return mimeType.includes("avc1") ? "MP4 / H.264" : "MP4";
        }

        async function resolveRecordMimeType() {
            if (verifiedMimeType !== null) return verifiedMimeType;
            for (const mimeType of RECORD_MIME_CANDIDATES) {
                if (!MediaRecorder.isTypeSupported(mimeType)) continue;
                if (await canActuallyRecord(mimeType)) {
                    verifiedMimeType = mimeType;
                    return verifiedMimeType;
                }
            }
            verifiedMimeType = "";
            return verifiedMimeType;
        }

        async function startRecording() {
            if (isRecording || recordingStarting) return;

            // 第一次錄製要跑格式探測，期間鎖住按鈕避免重複觸發
            recordingStarting = true;
            recordBtn.disabled = true;
            statusRecording.textContent = t("recording.preparing");

            let selectedMimeType;
            try {
                selectedMimeType = await resolveRecordMimeType();
            } finally {
                recordingStarting = false;
                recordBtn.disabled = false;
            }

            if (!selectedMimeType) {
                statusRecording.textContent = t("state.off");
                showError(t("error.recorderUnsupported"));
                return;
            }

            try {
                const stream = canvas.captureStream(30);
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: selectedMimeType,
                    videoBitsPerSecond: RECORD_BITRATE
                });
            } catch (e) {
                statusRecording.textContent = t("state.off");
                showError(t("error.recorderInitFailed") + e.message + "\n\n" + t("error.recorderRetryHint"));
                console.error(e);
                return;
            }

            recordedChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onerror = (e) => {
                showError(t("error.recorderRuntimeError") + (e.error ? e.error.name : t("error.recorderUnknown")));
                console.error("MediaRecorder error:", e);
            };

            mediaRecorder.onstop = () => {
                if (!recordedChunks.length) {
                    showError(t("error.recordingNoData") + "\n\n" + t("error.recordingNoDataHint"));
                    return;
                }
                const mimeType = mediaRecorder.mimeType || "video/webm";
                const fileExt = mimeType.includes("mp4") ? "mp4" : "webm";

                const blob = new Blob(recordedChunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "dart-trace-" + Date.now() + "." + fileExt;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                if (fileExt !== "mp4") {
                    showError(t("error.webmOnly") + "\n" + t("error.webmOnlyHint"));
                }
            };

            // 帶 timeslice：每秒就切出一塊資料，避免整段只在 stop 時才產生、
            // 中途發生問題就整份錄影都拿不到
            mediaRecorder.start(1000);
            isRecording = true;
            recordBtn.textContent = t("btn.record.stop");
            recordBtn.classList.add("recording");
            lastRecordFormatLabel = recordFormatLabel(selectedMimeType);
            statusRecording.textContent = t("recording.active", { format: lastRecordFormatLabel });

            if (video.paused || video.ended) {
                showError(t("error.recordWhilePaused"));
            }
        }

        function stopRecording() {
            if (!isRecording || !mediaRecorder) return;
            try {
                mediaRecorder.stop();
            } catch (e) {
                console.error("MediaRecorder 停止錯誤:", e);
            }
            isRecording = false;
            recordBtn.textContent = t("btn.record.start");
            recordBtn.classList.remove("recording");
            lastRecordFormatLabel = null;
            statusRecording.textContent = t("state.off");
        }

        function stopRecordingIfNeeded() {
            if (isRecording) stopRecording();
        }

        // === 檔案載入與影片事件 ===
        uploadBtn.addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            hideError();
            stopRecordingIfNeeded();
            stopDetectLoop();
            video.pause();
            clearCanvas();
            clearAllTraces();
            resetSmoothing();
            lastLandmarks = null;

            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }

            const url = URL.createObjectURL(file);
            currentObjectUrl = url;
            video.src = url;
            setPlaybackState("loadingVideo");
        });

        video.addEventListener("loadedmetadata", () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            canvasContainer.style.display = "block";

            playPauseBtn.disabled = false;
            resetBtn.disabled = false;
            recordBtn.disabled = false;
            settingsToggleBtn.disabled = false;

            video.currentTime = 0;
            clearCanvas();
            setPlaybackState("idle");
        });

        // 按鈕文字跟著影片的實際狀態走，不自己記狀態，
        // 這樣用鍵盤或其他方式改變播放狀態時也不會顯示錯誤
        function syncPlayPauseButton() {
            const playing = !video.paused && !video.ended;
            playPauseBtn.textContent = playing ? t("btn.pause") : t("btn.play");
            playPauseBtn.classList.toggle("play-btn", !playing);
            playPauseBtn.classList.toggle("pause-btn", playing);
        }

        video.addEventListener("play", () => {
            hideError();
            setPlaybackState("playing");
            syncPlayPauseButton();
            startDetectLoop();
        });

        video.addEventListener("pause", () => {
            stopDetectLoop();
            syncPlayPauseButton();
            if (!video.ended) setPlaybackState("paused");
        });

        video.addEventListener("ended", () => {
            stopDetectLoop();
            stopRecordingIfNeeded();
            syncPlayPauseButton();
            setPlaybackState("ended");
        });

        video.addEventListener("error", (e) => {
            const err = video.error;
            const msg = err
                ? t("error.videoLoadFailedCode", { code: err.code, msg: err.message })
                : t("error.videoLoadFailed");
            showError(msg + "\n\n" + t("error.videoFormatHint"));
            console.error("影片錯誤:", e, err);
        });

        // 回到影片開頭時，前一輪的軌跡與濾波狀態都要歸零，
        // 否則新一輪的線會直接疊在舊的上面
        function rewindToStart() {
            stopDetectLoop();
            clearCanvas();
            clearAllTraces();
            resetSmoothing();
            lastLandmarks = null;
            video.currentTime = 0;
        }

        // === 提供給 HTML 按鈕呼叫的控制函式 ===
        window.togglePlay = async function () {
            if (!video.paused && !video.ended) {
                video.pause();
                return;
            }

            // 播完之後再按播放會從頭開始，軌跡必須跟著重來；
            // 播到一半暫停後再播則是接續，不能清除
            if (video.ended) rewindToStart();

            hideError();
            try {
                await video.play();
            } catch (e) {
                showError(t("error.playFailed") + e.message);
                console.error("播放錯誤:", e);
            }
        };

        window.resetVideo = function () {
            rewindToStart();
            video.play()
                .then(() => {
                    setPlaybackState("playing");
                    startDetectLoop();
                })
                .catch((e) => {
                    showError(t("error.replayFailed") + e.message);
                    console.error("重新播放錯誤:", e);
                });
        };

        function renderSkeletonUI() {
            toggleSkeletonBtn.textContent = t("settings.skeletonLabel") + "：" + (skeletonEnabled ? t("state.on") : t("state.off"));
            statusSkeletonShow.textContent = skeletonEnabled ? t("state.on") : t("state.off");
        }

        window.toggleSkeleton = function () {
            skeletonEnabled = !skeletonEnabled;
            renderSkeletonUI();
            if (skeletonEnabled && !video.paused && !video.ended && !detecting) {
                startDetectLoop();
            }
        };

        // 四條軌跡合併成「顯示設定」裡的勾選清單，checkbox 已經是使用者按下後的新狀態，
        // 這裡只要讀值同步，不再用「翻轉」邏輯（翻轉容易跟畫面顯示的勾選狀態不一致）
        window.onTraceCheckboxChange = function (key, checkboxEl) {
            const trace = traces[key];
            trace.enabled = checkboxEl.checked;
            if (!trace.enabled) clearTrace(trace);
            updateTraceStatus();
            updateTraceSummary();
        };

        function updateTraceSummary() {
            const total = Object.keys(traces).length;
            const enabledCount = Object.values(traces).filter((t) => t.enabled).length;
            traceSummary.textContent = `(${enabledCount}/${total})`;
        }

        window.toggleSettingsPanel = function () {
            const willOpen = settingsPanel.hidden;
            settingsPanel.hidden = !willOpen;
            settingsToggleBtn.setAttribute("aria-expanded", String(willOpen));
            settingsChevron.textContent = willOpen ? "▴" : "▾";
        };

        function renderBlackBgUI() {
            toggleBlackBgBtn.textContent = t("settings.backgroundLabel") + "：" + (blackBgEnabled ? t("background.black") : t("background.video"));
            statusBlackBg.textContent = blackBgEnabled ? t("background.blackDesc") : t("background.video");
        }

        window.toggleBlackBg = function () {
            blackBgEnabled = !blackBgEnabled;
            canvasContainer.classList.toggle("black-bg", blackBgEnabled);
            renderBlackBgUI();
        };

        window.toggleRecording = function () {
            if (!video.src) {
                showError(t("error.loadVideoFirst"));
                return;
            }
            if (!isRecording) startRecording();
            else stopRecording();
        };

        // === 語言切換：重新渲染所有「目前狀態算出來的」文字 ===
        // 靜態文字交給 applyStaticTranslations()（讀 [data-i18n]）；
        // 這裡只處理會隨狀態變化、無法用固定字串描述的部分。
        function renderDynamicUI() {
            syncPlayPauseButton();
            renderSkeletonUI();
            renderBlackBgUI();
            updateTraceStatus();
            updateTraceSummary();

            statusPlayback.textContent = t("playback." + playbackStateKey);
            statusModel.textContent = t("model." + modelStatusKey);
            statusHand.textContent =
                dominantHand === null ? t("hand.auto") : dominantHand === "right" ? t("hand.right") : t("hand.left");

            if (isRecording && lastRecordFormatLabel) {
                statusRecording.textContent = t("recording.active", { format: lastRecordFormatLabel });
            } else if (recordingStarting) {
                statusRecording.textContent = t("recording.preparing");
            } else {
                statusRecording.textContent = t("state.off");
            }

            recordBtn.textContent = isRecording ? t("btn.record.stop") : t("btn.record.start");
        }

        window.setLanguage = function (lang) {
            if (!SUPPORTED_LANGS.includes(lang)) return;
            currentLang = lang;
            try {
                localStorage.setItem(LANG_STORAGE_KEY, lang);
            } catch (e) {
                // 儲存失敗（無痕模式等）不影響本次切換，只是下次開啟不會記住
            }
            const HTML_LANG_MAP = { zh: "zh-TW", ja: "ja", ko: "ko", en: "en" };
            document.documentElement.lang = HTML_LANG_MAP[lang] || "en";
            document.title = t("appTitle");
            applyStaticTranslations();
            renderDynamicUI();
            updateLangSwitchUI();

            // 通知這個 module 外面的腳本一起換語言。目前的訂閱者是 analytics.js
            // 的 Cookie 同意橫幅——它在 module scope 外，讀不到上面的 I18N，
            // 所以自帶翻譯表，靠這個事件跟著切換。
            document.dispatchEvent(new CustomEvent("darts:langchange", { detail: lang }));
        };

        // 初始化語言切換按鈕、套用記住的語言偏好，再載入 Pose 模型
        buildLangSwitch();
        window.setLanguage(currentLang);
        initPoseLandmarker();
    </script>
</body>
</html>
