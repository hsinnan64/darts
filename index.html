    <script type="module">
        // 匯入 MediaPipe Tasks Vision 中的 PoseLandmarker 與 FilesetResolver
        import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

        // === DOM 元素 ===
        const video = document.getElementById("videoElement");
        const canvas = document.getElementById("canvasElement");
        const ctx = canvas.getContext("2d");
        const canvasContainer = document.getElementById("canvasContainer");
        const loadingText = document.getElementById("loadingText");
        const errorMsg = document.getElementById("errorMsg");

        const uploadBtn = document.getElementById("uploadBtn");
        const fileInput = document.getElementById("fileInput");
        const playBtn = document.getElementById("playBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resetBtn = document.getElementById("resetBtn");
        const toggleSkeletonBtn = document.getElementById("toggleSkeletonBtn");
        const toggleWristTraceBtn = document.getElementById("toggleWristTraceBtn");
        const toggleBlackBgBtn = document.getElementById("toggleBlackBgBtn");
        const recordBtn = document.getElementById("recordBtn");

        const statusPlayback = document.getElementById("statusPlayback");
        const statusModel = document.getElementById("statusModel");
        const statusSkeletonShow = document.getElementById("statusSkeletonShow");
        const statusWristTrace = document.getElementById("statusWristTrace");
        const statusHand = document.getElementById("statusHand");
        const statusHeadMove = document.getElementById("statusHeadMove");
        const statusShoulderMove = document.getElementById("statusShoulderMove");
        const toggleHeadTraceBtn = document.getElementById("toggleHeadTraceBtn");
        const toggleShoulderTraceBtn = document.getElementById("toggleShoulderTraceBtn");
        const statusBlackBg = document.getElementById("statusBlackBg");
        const statusFPS = document.getElementById("statusFPS");
        const statusRecording = document.getElementById("statusRecording");

        // === MediaPipe / 偵測相關 ===
        let poseLandmarker = null;
        let modelReady = false;

        // 檢測迴圈控制
        let detecting = false;
        const hasRVFC = "requestVideoFrameCallback" in HTMLVideoElement.prototype;
        let rvfcId = null;
        let rafId = null;

        // 顯示開關與影片來源
        let skeletonEnabled = true;
        let blackBgEnabled = false;
        let currentObjectUrl = null;

        // MediaPipe Pose 關鍵點索引
        const LEFT_WRIST = 15;
        const RIGHT_WRIST = 16;
        // 手臂關鍵點（手肘、手腕）移動最快、偵測最不穩，需要較強的濾波
        const FAST_LIMB_INDICES = new Set([13, 14, 15, 16]);

        // 低於此可信度的關鍵點視為不可靠，不繪製也不納入軌跡
        const MIN_VISIBILITY_DRAW = 0.35;
        const MIN_VISIBILITY_TRACE = 0.3;

        // 單次偵測間，關鍵點在正規化座標中不可能超過的位移量（超過視為誤判）
        const MAX_JUMP_PER_DETECT = 0.22;
        const MAX_CONSECUTIVE_REJECTS = 3;

        // === 平滑濾波：中位數去尖刺 + One Euro Filter 時間平滑（固定啟用） ===
        const MEDIAN_WINDOW = 5;
        const rawHistoryX = new Map();
        const rawHistoryY = new Map();

        function medianOf(arr) {
            const s = [...arr].sort((a, b) => a - b);
            return s[Math.floor(s.length / 2)];
        }

        function medianFilterPoint(idx, x, y) {
            let hx = rawHistoryX.get(idx);
            let hy = rawHistoryY.get(idx);
            if (!hx) { hx = []; rawHistoryX.set(idx, hx); }
            if (!hy) { hy = []; rawHistoryY.set(idx, hy); }

            hx.push(x);
            hy.push(y);
            if (hx.length > MEDIAN_WINDOW) hx.shift();
            if (hy.length > MEDIAN_WINDOW) hy.shift();

            if (hx.length < 3) return { x, y };
            return { x: medianOf(hx), y: medianOf(hy) };
        }

        function makeFilterParams(idx) {
            if (FAST_LIMB_INDICES.has(idx)) {
                // 手肘/手腕：偵測雜訊最大，用最強的平滑設定
                return { minCutoff: 0.35, beta: 0.05, dCutoff: 1.0 };
            }
            return { minCutoff: 0.8, beta: 0.2, dCutoff: 1.0 };
        }

        function lowPassAlpha(cutoff, dt) {
            const tau = 1.0 / (2 * Math.PI * cutoff);
            return 1.0 / (1.0 + tau / dt);
        }

        class OneEuroFilter1D {
            constructor({ minCutoff, beta, dCutoff }) {
                this.minCutoff = minCutoff;
                this.beta = beta;
                this.dCutoff = dCutoff;
                this.xPrev = null;
                this.dxPrev = 0;
                this.tPrev = null;
            }
            filter(x, t) {
                if (this.tPrev === null) {
                    this.tPrev = t;
                    this.xPrev = x;
                    this.dxPrev = 0;
                    return x;
                }
                const dt = Math.max((t - this.tPrev) / 1000, 1 / 240);
                this.tPrev = t;

                const dx = (x - this.xPrev) / dt;
                const aD = lowPassAlpha(this.dCutoff, dt);
                const dxHat = aD * dx + (1 - aD) * this.dxPrev;

                const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
                const a = lowPassAlpha(cutoff, dt);
                const xHat = a * x + (1 - a) * this.xPrev;

                this.xPrev = xHat;
                this.dxPrev = dxHat;
                return xHat;
            }
        }

        const landmarkFiltersX = new Map();
        const landmarkFiltersY = new Map();

        function getFilter(map, idx) {
            let f = map.get(idx);
            if (!f) {
                f = new OneEuroFilter1D(makeFilterParams(idx));
                map.set(idx, f);
            }
            return f;
        }

        // 離群點拒絕用的前次可信位置
        const lastAcceptedPoint = new Map();
        const rejectCount = new Map();

        function resetSmoothing() {
            landmarkFiltersX.clear();
            landmarkFiltersY.clear();
            rawHistoryX.clear();
            rawHistoryY.clear();
            lastAcceptedPoint.clear();
            rejectCount.clear();
        }

        function rejectOutlier(idx, x, y) {
            const prev = lastAcceptedPoint.get(idx);
            if (!prev) {
                lastAcceptedPoint.set(idx, { x, y });
                rejectCount.set(idx, 0);
                return { x, y };
            }
            const dist = Math.hypot(x - prev.x, y - prev.y);
            const rejects = rejectCount.get(idx) || 0;

            if (dist > MAX_JUMP_PER_DETECT && rejects < MAX_CONSECUTIVE_REJECTS) {
                rejectCount.set(idx, rejects + 1);
                return prev;
            }
            rejectCount.set(idx, 0);
            lastAcceptedPoint.set(idx, { x, y });
            return { x, y };
        }

        function smoothLandmarks(landmarks, t) {
            return landmarks.map((lm, i) => {
                if (!lm) return lm;
                const cleaned = rejectOutlier(i, lm.x, lm.y);
                const med = medianFilterPoint(i, cleaned.x, cleaned.y);
                const fx = getFilter(landmarkFiltersX, i);
                const fy = getFilter(landmarkFiltersY, i);
                return {
                    x: fx.filter(med.x, t),
                    y: fy.filter(med.y, t),
                    z: lm.z,
                    visibility: lm.visibility
                };
            });
        }

        // === 軌跡：手腕（紅）／頭部（黃）／肩膀（青），三條各自獨立開關 ===
        //
        // 用途差異：
        //   手腕 — 看出手路徑是否一致
        //   頭部、肩膀 — 投擲時這兩處應該幾乎不動，軌跡越短越集中代表動作越穩定，
        //                所以除了畫線，還會即時算出移動幅度給使用者參考
        const MAX_TRACE_POINTS = 800;        // 保留夠長的軌跡，不會中途消失
        const MIN_TRACE_SPACING = 0.004;     // 幾乎沒動就不重複記錄

        // 關鍵點索引
        const WRIST_INDEX = { left: 15, right: 16 };
        const SHOULDER_INDEX = { left: 11, right: 12 };
        const NOSE_INDEX = 0; // 以鼻子代表頭部位置：側面拍攝時也看得到，比耳朵穩定

        function createTrace(color, enabled) {
            return { points: [], color, enabled };
        }

        const traces = {
            wrist: createTrace("255,60,60", true),    // 紅
            head: createTrace("255,215,70", false),   // 黃
            shoulder: createTrace("80,210,255", false) // 青
        };

        function createHandState() {
            return { moveAmount: 0, prevPoint: null };
        }

        const handStates = {
            left: createHandState(),
            right: createHandState()
        };

        // 投擲手：取累積移動量較大的那隻手，只畫它的軌跡，畫面才不會被另一手干擾
        let dominantHand = null;

        function clearAllTraces() {
            for (const key of Object.keys(traces)) {
                traces[key].points.length = 0;
            }
            handStates.left = createHandState();
            handStates.right = createHandState();
            dominantHand = null;
            statusHand.textContent = "自動判斷中";
            updateStabilityStatus();
        }

        function pushTracePoint(trace, lm) {
            if (!lm) return;
            if (lm.visibility != null && lm.visibility < MIN_VISIBILITY_TRACE) return;

            const last = trace.points[trace.points.length - 1];
            if (last) {
                const d = Math.hypot(lm.x - last.x, lm.y - last.y);
                if (d < MIN_TRACE_SPACING) return;
            }
            trace.points.push({ x: lm.x, y: lm.y });
            if (trace.points.length > MAX_TRACE_POINTS) trace.points.shift();
        }

        // 累積該手的移動量，供投擲手判定
        function accumulateMovement(state, lm) {
            if (!lm) return;
            if (lm.visibility != null && lm.visibility < MIN_VISIBILITY_TRACE) return;
            if (state.prevPoint) {
                state.moveAmount += Math.hypot(lm.x - state.prevPoint.x, lm.y - state.prevPoint.y);
            }
            state.prevPoint = { x: lm.x, y: lm.y };
        }

        function updateTraces(landmarks) {
            if (!landmarks || !Array.isArray(landmarks)) return;

            const leftWrist = landmarks[WRIST_INDEX.left];
            const rightWrist = landmarks[WRIST_INDEX.right];
            accumulateMovement(handStates.left, leftWrist);
            accumulateMovement(handStates.right, rightWrist);

            const hand = handStates.right.moveAmount >= handStates.left.moveAmount ? "right" : "left";
            if (hand !== dominantHand) {
                dominantHand = hand;
                statusHand.textContent = hand === "right" ? "右手" : "左手";
            }

            if (traces.wrist.enabled) {
                pushTracePoint(traces.wrist, hand === "right" ? rightWrist : leftWrist);
            }
            if (traces.head.enabled) {
                pushTracePoint(traces.head, landmarks[NOSE_INDEX]);
            }
            if (traces.shoulder.enabled) {
                // 追蹤投擲手同側的肩膀，方便和手臂動作直接對照
                pushTracePoint(traces.shoulder, landmarks[SHOULDER_INDEX[hand]]);
            }

            updateStabilityStatus();
        }

        // 移動幅度＝軌跡點涵蓋範圍的對角線長度（正規化座標），轉成畫面百分比
        function traceSpread(trace) {
            const pts = trace.points;
            if (pts.length < 2) return 0;
            let minX = 1, maxX = 0, minY = 1, maxY = 0;
            for (const p of pts) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }
            return Math.hypot(maxX - minX, maxY - minY);
        }

        // 門檻為初步估值，實測後可再調整
        function stabilityLabel(spread) {
            const pct = (spread * 100).toFixed(1) + "%";
            if (spread < 0.02) return "穩定（" + pct + "）";
            if (spread < 0.05) return "輕微晃動（" + pct + "）";
            return "明顯移動（" + pct + "）";
        }

        function updateStabilityStatus() {
            statusHeadMove.textContent = traces.head.enabled
                ? (traces.head.points.length < 2 ? "偵測中…" : stabilityLabel(traceSpread(traces.head)))
                : "未開啟";
            statusShoulderMove.textContent = traces.shoulder.enabled
                ? (traces.shoulder.points.length < 2 ? "偵測中…" : stabilityLabel(traceSpread(traces.shoulder)))
                : "未開啟";
        }

        // 畫所有已開啟的軌跡：固定顏色與粗細，不淡出、不消失
        // 手腕最後畫，確保疊在最上層
        function drawTraces() {
            for (const key of ["head", "shoulder", "wrist"]) {
                if (traces[key].enabled) drawTraceLine(traces[key]);
            }
        }

        function drawTraceLine(trace) {
            const pts = trace.points;
            if (pts.length < 2) return;

            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = `rgba(${trace.color},0.9)`;
            ctx.lineWidth = 4;

            ctx.beginPath();
            ctx.moveTo(pts[0].x * canvas.width, pts[0].y * canvas.height);

            if (pts.length === 2) {
                ctx.lineTo(pts[1].x * canvas.width, pts[1].y * canvas.height);
            } else {
                // 以相鄰點中點為節點的二次貝茲曲線，讓折線變滑順
                for (let i = 1; i < pts.length - 1; i++) {
                    const curX = pts[i].x * canvas.width;
                    const curY = pts[i].y * canvas.height;
                    const midX = (curX + pts[i + 1].x * canvas.width) / 2;
                    const midY = (curY + pts[i + 1].y * canvas.height) / 2;
                    ctx.quadraticCurveTo(curX, curY, midX, midY);
                }
                const last = pts[pts.length - 1];
                ctx.lineTo(last.x * canvas.width, last.y * canvas.height);
            }
            ctx.stroke();
        }

        // === FPS 計算相關 ===
        const frameTimes = [];
        let lastFPSUpdate = 0;

        let lastLandmarks = null;

        // === 共用 UI 函式 ===
        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = "block";
        }

        function hideError() {
            errorMsg.textContent = "";
            errorMsg.style.display = "none";
        }

        function setPlaybackStatus(text) {
            statusPlayback.textContent = text;
        }

        // === 初始化 MediaPipe Pose 模型 ===
        async function initPoseLandmarker() {
            loadingText.style.display = "block";
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );
                poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        // full 模型：手臂快速揮動時的關鍵點精度明顯優於 lite
                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 1,
                    minPoseDetectionConfidence: 0.6,
                    minPosePresenceConfidence: 0.6,
                    minTrackingConfidence: 0.6
                });
                modelReady = true;
                loadingText.style.display = "none";
                statusModel.textContent = "已載入 (full)";
            } catch (e) {
                loadingText.style.display = "none";
                showError("MediaPipe 初始化失敗：" + e.message);
                console.error(e);
            }
        }

        function clearCanvas() {
            if (!canvas.width || !canvas.height) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function stopDetectLoop() {
            detecting = false;
            if (rvfcId !== null && typeof video.cancelVideoFrameCallback === "function") {
                video.cancelVideoFrameCallback(rvfcId);
            }
            rvfcId = null;
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
            }
            rafId = null;
        }

        function startDetectLoop() {
            if (detecting) return;
            if (video.paused || video.ended) return;
            detecting = true;
            if (hasRVFC) {
                rvfcId = video.requestVideoFrameCallback(onVideoFrame);
            } else {
                rafId = requestAnimationFrame(onAnimationFrame);
            }
        }

        function onVideoFrame() {
            processFrame();
            if (detecting && !video.paused && !video.ended) {
                rvfcId = video.requestVideoFrameCallback(onVideoFrame);
            } else {
                detecting = false;
            }
        }

        function onAnimationFrame() {
            processFrame();
            if (detecting && !video.paused && !video.ended) {
                rafId = requestAnimationFrame(onAnimationFrame);
            } else {
                detecting = false;
            }
        }

        function updateFPS(now) {
            frameTimes.push(now);
            while (frameTimes.length && frameTimes[0] <= now - 1000) {
                frameTimes.shift();
            }
            const fps = frameTimes.length;
            if (now - lastFPSUpdate > 200) {
                statusFPS.textContent = fps.toFixed(0) + " FPS";
                lastFPSUpdate = now;
            }
        }

        // 單幀處理：畫背景 + 骨架偵測 + 繪製
        function processFrame() {
            const now = performance.now();
            updateFPS(now);

            // 1. 畫背景：影片畫面，或純黑
            if (blackBgEnabled) {
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                try {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                } catch (e) {
                    // 影片剛開始可能尚無 frame
                }
            }

            if (!poseLandmarker || !modelReady) return;
            if (!skeletonEnabled) {
                // 骨架關閉時仍然把已記錄的軌跡畫出來
                drawTraces();
                return;
            }

            try {
                // 2. 每個新影片幀都做一次偵測，避免節流造成的階梯式跳動
                const result = poseLandmarker.detectForVideo(video, now);
                if (result.landmarks && result.landmarks.length > 0) {
                    lastLandmarks = smoothLandmarks(result.landmarks[0], now);
                    // 3. 軌跡只在拿到新偵測結果時累積
                    updateTraces(lastLandmarks);
                }

                drawTraces();
                if (lastLandmarks) drawSkeleton(lastLandmarks);
            } catch (e) {
                console.error("detectForVideo 錯誤:", e);
            }
        }

        // 畫骨架線段與節點
        function drawSkeleton(landmarks) {
            if (!landmarks || !Array.isArray(landmarks)) return;

            const connections = [
                [11, 12], [11, 23], [12, 24], [23, 24],
                [11, 13], [13, 15], [12, 14], [14, 16],
                [23, 25], [25, 27], [27, 29], [29, 31],
                [24, 26], [26, 28], [28, 30], [30, 32],
                // 頭部：鼻子—眼睛—耳朵，以及嘴巴
                [0, 1], [1, 2], [2, 3], [3, 7],
                [0, 4], [4, 5], [5, 6], [6, 8],
                [9, 10]
            ];

            const visible = (lm) =>
                lm && (lm.visibility == null || lm.visibility >= MIN_VISIBILITY_DRAW);

            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineCap = "round";

            for (const [s, e] of connections) {
                const a = landmarks[s];
                const b = landmarks[e];
                if (!visible(a) || !visible(b)) continue;
                ctx.beginPath();
                ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
                ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
                ctx.stroke();
            }

            for (let i = 0; i < landmarks.length; i++) {
                if (i >= 17 && i <= 22) continue; // 17–22 為手指節點
                const lm = landmarks[i];
                if (!visible(lm)) continue;

                const x = lm.x * canvas.width;
                const y = lm.y * canvas.height;
                const alpha = lm.visibility != null ? lm.visibility : 0.8;
                // 頭部點密集，畫小一點才不會糊成一團遮住臉
                const radius = i <= 10 ? 4 : 7;

                ctx.beginPath();
                ctx.fillStyle = `rgba(255,0,0,${alpha})`;
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // === 錄製：把 canvas 畫面（影片 + 骨架 + 軌跡）另存成影片檔 ===
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        function startRecording() {
            if (isRecording) return;
            try {
                const stream = canvas.captureStream(30);

                // WebM 放前面：Chrome / Edge 對 canvas 串流的 WebM 編碼最穩定，
                // 部分版本雖然回報支援 MP4，實際錄 canvas 卻產不出可用的檔案。
                let selectedMimeType = "";
                const supportedMimeTypes = [
                    "video/webm;codecs=vp9",
                    "video/webm;codecs=vp8",
                    "video/webm",
                    "video/mp4"
                ];
                for (const mimeType of supportedMimeTypes) {
                    if (MediaRecorder.isTypeSupported(mimeType)) {
                        selectedMimeType = mimeType;
                        break;
                    }
                }
                if (!selectedMimeType) {
                    showError("此瀏覽器不支援 MediaRecorder 錄影，請改用最新版 Chrome / Edge。");
                    return;
                }

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: selectedMimeType,
                    videoBitsPerSecond: 5000000
                });
            } catch (e) {
                showError("錄製初始化失敗：" + e.message + "\n\n請改用最新版 Chrome / Edge。");
                console.error(e);
                return;
            }

            recordedChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onerror = (e) => {
                showError("錄製過程發生錯誤：" + (e.error ? e.error.name : "未知錯誤"));
                console.error("MediaRecorder error:", e);
            };

            mediaRecorder.onstop = () => {
                if (!recordedChunks.length) {
                    showError("錄製結束但沒有取得任何畫面資料。\n\n請確認錄製期間影片有在播放（暫停時畫面不會更新，錄不到內容）。");
                    return;
                }
                const mimeType = mediaRecorder.mimeType || "video/webm";
                const fileExt = mimeType.includes("mp4") ? "mp4" : "webm";

                const blob = new Blob(recordedChunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "dart-trace-" + Date.now() + "." + fileExt;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            // 帶 timeslice：每秒就切出一塊資料，避免整段只在 stop 時才產生、
            // 中途發生問題就整份錄影都拿不到
            mediaRecorder.start(1000);
            isRecording = true;
            recordBtn.textContent = "停止錄製";
            recordBtn.classList.add("recording");
            statusRecording.textContent = "錄製中";

            if (video.paused || video.ended) {
                showError("提醒：目前影片沒有在播放，錄下來會是靜止畫面。請按「播放」後再錄製。");
            }
        }

        function stopRecording() {
            if (!isRecording || !mediaRecorder) return;
            try {
                mediaRecorder.stop();
            } catch (e) {
                console.error("MediaRecorder 停止錯誤:", e);
            }
            isRecording = false;
            recordBtn.textContent = "開始錄製";
            recordBtn.classList.remove("recording");
            statusRecording.textContent = "關";
        }

        function stopRecordingIfNeeded() {
            if (isRecording) stopRecording();
        }

        // === 檔案載入與影片事件 ===
        uploadBtn.addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            hideError();
            stopRecordingIfNeeded();
            stopDetectLoop();
            video.pause();
            clearCanvas();
            clearAllTraces();
            resetSmoothing();
            lastLandmarks = null;

            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }

            const url = URL.createObjectURL(file);
            currentObjectUrl = url;
            video.src = url;
            setPlaybackStatus("載入影片中…");
        });

        video.addEventListener("loadedmetadata", () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            canvasContainer.style.display = "block";

            playBtn.disabled = false;
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            toggleSkeletonBtn.disabled = false;
            toggleWristTraceBtn.disabled = false;
            toggleHeadTraceBtn.disabled = false;
            toggleShoulderTraceBtn.disabled = false;
            toggleBlackBgBtn.disabled = false;
            recordBtn.disabled = false;

            video.currentTime = 0;
            clearCanvas();
            setPlaybackStatus("待機");
        });

        video.addEventListener("play", () => {
            hideError();
            setPlaybackStatus("播放中");
            startDetectLoop();
        });

        video.addEventListener("pause", () => {
            stopDetectLoop();
            if (!video.ended) setPlaybackStatus("已暫停");
        });

        video.addEventListener("ended", () => {
            stopDetectLoop();
            stopRecordingIfNeeded();
            setPlaybackStatus("已結束");
        });

        video.addEventListener("error", (e) => {
            const err = video.error;
            const msg = err
                ? `影片載入失敗 (錯誤碼 ${err.code}): ${err.message}`
                : "影片載入失敗";
            showError(msg + "\n\n請確認影片為 H.264 編碼的 MP4 格式");
            console.error("影片錯誤:", e, err);
        });

        // === 提供給 HTML 按鈕呼叫的控制函式 ===
        window.playVideo = async function () {
            hideError();
            try {
                await video.play();
            } catch (e) {
                showError("播放失敗：" + e.message);
                console.error("播放錯誤:", e);
            }
        };

        window.pauseVideo = function () {
            video.pause();
        };

        window.resetVideo = function () {
            stopDetectLoop();
            clearCanvas();
            clearAllTraces();
            resetSmoothing();
            lastLandmarks = null;
            video.currentTime = 0;
            video.play()
                .then(() => {
                    setPlaybackStatus("播放中");
                    startDetectLoop();
                })
                .catch((e) => {
                    showError("重新播放失敗：" + e.message);
                    console.error("重新播放錯誤:", e);
                });
        };

        window.toggleSkeleton = function () {
            skeletonEnabled = !skeletonEnabled;
            toggleSkeletonBtn.textContent = skeletonEnabled ? "骨架：開" : "骨架：關";
            statusSkeletonShow.textContent = skeletonEnabled ? "開" : "關";
            if (skeletonEnabled && !video.paused && !video.ended && !detecting) {
                startDetectLoop();
            }
        };

        // 關閉某條軌跡時只清掉它自己的點，其他兩條不受影響
        function toggleTrace(key, btn, label, statusEl) {
            const trace = traces[key];
            trace.enabled = !trace.enabled;
            if (!trace.enabled) trace.points.length = 0;
            btn.textContent = label + (trace.enabled ? "：開" : "：關");
            if (statusEl) statusEl.textContent = trace.enabled ? "開" : "關";
            updateStabilityStatus();
        }

        window.toggleWristTrace = function () {
            toggleTrace("wrist", toggleWristTraceBtn, "手腕軌跡", statusWristTrace);
        };

        window.toggleHeadTrace = function () {
            toggleTrace("head", toggleHeadTraceBtn, "頭部軌跡", null);
        };

        window.toggleShoulderTrace = function () {
            toggleTrace("shoulder", toggleShoulderTraceBtn, "肩膀軌跡", null);
        };

        window.toggleBlackBg = function () {
            blackBgEnabled = !blackBgEnabled;
            canvasContainer.classList.toggle("black-bg", blackBgEnabled);
            toggleBlackBgBtn.textContent = blackBgEnabled ? "背景：純黑" : "背景：影片";
            statusBlackBg.textContent = blackBgEnabled ? "純黑（只看點線軌跡）" : "影片";
        };

        window.toggleRecording = function () {
            if (!video.src) {
                showError("請先載入影片再錄製。");
                return;
            }
            if (!isRecording) startRecording();
            else stopRecording();
        };

        // 初始化 Pose 模型
        initPoseLandmarker();
    </script>
</body>
</html>
