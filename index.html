<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飛鏢投擲骨架分析器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 整體背景：寧靜藍色系 */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            background: #f9fbff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(15,23,42,0.10);
            padding: 20px 16px 18px;
            max-width: 960px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .container {
                padding: 24px 28px 22px;
            }
        }

        h1 {
            color: #1d4ed8;
            text-align: center;
            margin-bottom: 4px;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 14px;
        }

        /* 按鈕區：RWD 網格 */
        .controls {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            max-width: 820px;
            margin: 8px auto 14px;
        }

        .control-btn {
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            padding: 10px 8px;
            text-align: center;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 1px 4px rgba(15,23,42,0.15);
            min-height: 38px;
            background: #e5e7eb;
            color: #111827;
        }

        .control-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 選擇檔案：灰色 */
        .upload-btn {
            background: #e5e7eb;
            color: #111827;
        }

        /* 播放：綠色（柔和一點） */
        .play-btn {
            background: #4ade80;
            color: #064e3b;
        }

        /* 暫停：橙色（偏柔和） */
        .pause-btn {
            background: #fdba74;
            color: #7c2d12;
        }

        /* 重播：藍色（配合主題） */
        .reset-btn {
            background: #60a5fa;
            color: #eff6ff;
        }

        /* 骨架開關：淡藍灰 */
        .toggle-btn {
            background: #bfdbfe;
            color: #1e3a8a;
        }

        /* 手腕軌跡：紫色 */
        .wrist-trace-btn {
            background: #c084fc;
            color: #4c0519;
        }

        /* 平滑開關：薄荷綠 */
        .smooth-btn {
            background: #99f6e4;
            color: #134e4a;
        }

        /* 純黑背景：深灰 */
        .blackbg-btn {
            background: #475569;
            color: #f8fafc;
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(15,23,42,0.18);
            opacity: 0.96;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            margin: 10px 0 8px;
            background: #0f172a;
            border-radius: 14px;
            overflow: hidden;
            display: none;
        }

        #videoElement {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 純黑背景模式時把原始 video 元素藏起來，只留 canvas 的繪製結果 */
        .canvas-container.black-bg #videoElement {
            visibility: hidden;
        }

        #canvasElement {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .loading {
            text-align: center;
            color: #1d4ed8;
            font-size: 14px;
            margin: 6px 0 4px;
        }

        .error-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 12px;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 13px;
            display: none;
            white-space: pre-line;
        }

        .info {
            background: #e0ecff;
            padding: 10px 12px;
            border-radius: 14px;
            margin-top: 8px;
            font-size: 13px;
            color: #1f2937;
            line-height: 1.7;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .info-label {
            font-weight: 600;
        }

        .info-value {
            font-weight: 500;
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>飛鏢投擲骨架分析器</h1>
        <div class="subtitle">穩定追蹤版：去尖刺濾波 + 離群點拒絕</div>

        <!-- 控制區：RWD -->
        <div class="controls" id="controls">
            <button class="control-btn upload-btn" id="uploadBtn">
                選擇影片
            </button>
            <input type="file" id="fileInput" accept="video/*" style="display:none;" />

            <button class="control-btn play-btn" id="playBtn" onclick="playVideo()" disabled>播放</button>
            <button class="control-btn pause-btn" id="pauseBtn" onclick="pauseVideo()" disabled>暫停</button>
            <button class="control-btn reset-btn" id="resetBtn" onclick="resetVideo()" disabled>重新播放</button>
            <button class="control-btn toggle-btn" id="toggleSkeletonBtn" onclick="toggleSkeleton()" disabled>骨架：開</button>
            <button class="control-btn wrist-trace-btn" id="toggleWristTraceBtn" onclick="toggleWristTrace()" disabled>手腕軌跡：關</button>
            <button class="control-btn smooth-btn" id="toggleSmoothBtn" onclick="toggleSmoothing()" disabled>平滑：開</button>
            <button class="control-btn blackbg-btn" id="toggleBlackBgBtn" onclick="toggleBlackBg()" disabled>背景：影片</button>
        </div>

        <div id="loadingText" class="loading" style="display:none;">
            正在載入骨架模型，請稍候...
        </div>

        <div class="canvas-container" id="canvasContainer">
            <video id="videoElement" playsinline></video>
            <canvas id="canvasElement"></canvas>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <div class="info">
            <div class="info-row">
                <span class="info-label">播放狀態：</span>
                <span class="info-value" id="statusPlayback">待機</span>
            </div>
            <div class="info-row">
                <span class="info-label">骨架載入：</span>
                <span class="info-value" id="statusModel">載入中…</span>
            </div>
            <div class="info-row">
                <span class="info-label">骨架顯示：</span>
                <span class="info-value" id="statusSkeletonShow">開</span>
            </div>
            <div class="info-row">
                <span class="info-label">手腕軌跡：</span>
                <span class="info-value" id="statusWristTrace">關</span>
            </div>
            <div class="info-row">
                <span class="info-label">平滑濾波：</span>
                <span class="info-value" id="statusSmooth">開</span>
            </div>
            <div class="info-row">
                <span class="info-label">背景模式：</span>
                <span class="info-value" id="statusBlackBg">影片</span>
            </div>
            <div class="info-row">
                <span class="info-label">目前幀率：</span>
                <span class="info-value" id="statusFPS">-- FPS</span>
            </div>
        </div>
    </div>

    <script type="module">
        // 匯入 MediaPipe Tasks Vision 中的 PoseLandmarker 與 FilesetResolver
        import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

        // === DOM 元素 ===
        const video = document.getElementById("videoElement");
        const canvas = document.getElementById("canvasElement");
        const ctx = canvas.getContext("2d");
        const canvasContainer = document.getElementById("canvasContainer");
        const loadingText = document.getElementById("loadingText");
        const errorMsg = document.getElementById("errorMsg");

        const uploadBtn = document.getElementById("uploadBtn");
        const fileInput = document.getElementById("fileInput");
        const playBtn = document.getElementById("playBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resetBtn = document.getElementById("resetBtn");
        const toggleSkeletonBtn = document.getElementById("toggleSkeletonBtn");
        const toggleWristTraceBtn = document.getElementById("toggleWristTraceBtn");
        const toggleSmoothBtn = document.getElementById("toggleSmoothBtn");
        const toggleBlackBgBtn = document.getElementById("toggleBlackBgBtn");

        const statusPlayback = document.getElementById("statusPlayback");
        const statusModel = document.getElementById("statusModel");
        const statusSkeletonShow = document.getElementById("statusSkeletonShow");
        const statusWristTrace = document.getElementById("statusWristTrace");
        const statusSmooth = document.getElementById("statusSmooth");
        const statusBlackBg = document.getElementById("statusBlackBg");
        const statusFPS = document.getElementById("statusFPS");

        // === MediaPipe / 偵測相關 ===
        let poseLandmarker = null;     // MediaPipe Pose 模型實例
        let modelReady = false;        // 模型是否載入完成

        // 檢測迴圈控制
        let detecting = false;
        const hasRVFC = "requestVideoFrameCallback" in HTMLVideoElement.prototype; // 是否支援 requestVideoFrameCallback
        let rvfcId = null;
        let rafId = null;

        // 顯示開關與影片來源
        let skeletonEnabled = true;
        let blackBgEnabled = false;
        let currentObjectUrl = null;

        // MediaPipe Pose 關鍵點索引
        const LEFT_WRIST = 15;
        const RIGHT_WRIST = 16;
        // 手臂關鍵點（手肘、手腕）移動最快、偵測最不穩，需要較強的濾波
        const FAST_LIMB_INDICES = new Set([13, 14, 15, 16]);

        // 低於此可信度的關鍵點視為不可靠，不繪製也不納入軌跡
        const MIN_VISIBILITY_DRAW = 0.35;
        const MIN_VISIBILITY_TRACE = 0.5;

        // 單次偵測間，關鍵點在正規化座標中不可能超過的位移量。
        // 超過就視為誤判（例如手臂被遮擋時模型把點甩到別的位置），直接沿用前一次的值。
        const MAX_JUMP_PER_DETECT = 0.22;
        const MAX_CONSECUTIVE_REJECTS = 3; // 連續拒絕太多次就接受新值，避免永久卡住

        // === 平滑濾波：中位數去尖刺 + One Euro Filter 時間平滑 ===
        let smoothingEnabled = true;

        const MEDIAN_WINDOW = 5; // 5 幀中位數，可完全吃掉連續兩幀的誤判尖刺
        const rawHistoryX = new Map();
        const rawHistoryY = new Map();

        function medianOf(arr) {
            const s = [...arr].sort((a, b) => a - b);
            return s[Math.floor(s.length / 2)];
        }

        function medianFilterPoint(idx, x, y) {
            let hx = rawHistoryX.get(idx);
            let hy = rawHistoryY.get(idx);
            if (!hx) { hx = []; rawHistoryX.set(idx, hx); }
            if (!hy) { hy = []; rawHistoryY.set(idx, hy); }

            hx.push(x);
            hy.push(y);
            if (hx.length > MEDIAN_WINDOW) hx.shift();
            if (hy.length > MEDIAN_WINDOW) hy.shift();

            if (hx.length < 3) return { x, y }; // 剛開始資料不足，先照原值
            return { x: medianOf(hx), y: medianOf(hy) };
        }

        // One Euro Filter：beta 越小 → 快速移動時仍維持強平滑（抖動少、略有延遲）
        function makeFilterParams(idx) {
            if (FAST_LIMB_INDICES.has(idx)) {
                // 手肘/手腕：偵測雜訊最大，用最強的平滑設定
                return { minCutoff: 0.35, beta: 0.05, dCutoff: 1.0 };
            }
            return { minCutoff: 0.8, beta: 0.2, dCutoff: 1.0 };
        }

        function lowPassAlpha(cutoff, dt) {
            const tau = 1.0 / (2 * Math.PI * cutoff);
            return 1.0 / (1.0 + tau / dt);
        }

        class OneEuroFilter1D {
            constructor({ minCutoff, beta, dCutoff }) {
                this.minCutoff = minCutoff;
                this.beta = beta;
                this.dCutoff = dCutoff;
                this.xPrev = null;
                this.dxPrev = 0;
                this.tPrev = null;
            }
            filter(x, t) {
                if (this.tPrev === null) {
                    this.tPrev = t;
                    this.xPrev = x;
                    this.dxPrev = 0;
                    return x;
                }
                const dt = Math.max((t - this.tPrev) / 1000, 1 / 240); // 秒，避免除以 0
                this.tPrev = t;

                const dx = (x - this.xPrev) / dt;
                const aD = lowPassAlpha(this.dCutoff, dt);
                const dxHat = aD * dx + (1 - aD) * this.dxPrev;

                const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
                const a = lowPassAlpha(cutoff, dt);
                const xHat = a * x + (1 - a) * this.xPrev;

                this.xPrev = xHat;
                this.dxPrev = dxHat;
                return xHat;
            }
        }

        const landmarkFiltersX = new Map();
        const landmarkFiltersY = new Map();

        function getFilter(map, idx) {
            let f = map.get(idx);
            if (!f) {
                f = new OneEuroFilter1D(makeFilterParams(idx));
                map.set(idx, f);
            }
            return f;
        }

        // 離群點拒絕用的前次可信位置
        const lastAcceptedPoint = new Map(); // idx -> {x, y}
        const rejectCount = new Map();       // idx -> 連續拒絕次數

        function resetSmoothing() {
            landmarkFiltersX.clear();
            landmarkFiltersY.clear();
            rawHistoryX.clear();
            rawHistoryY.clear();
            lastAcceptedPoint.clear();
            rejectCount.clear();
        }

        // 離群值拒絕：位移超過物理上限就沿用前值
        function rejectOutlier(idx, x, y) {
            const prev = lastAcceptedPoint.get(idx);
            if (!prev) {
                lastAcceptedPoint.set(idx, { x, y });
                rejectCount.set(idx, 0);
                return { x, y };
            }
            const dist = Math.hypot(x - prev.x, y - prev.y);
            const rejects = rejectCount.get(idx) || 0;

            if (dist > MAX_JUMP_PER_DETECT && rejects < MAX_CONSECUTIVE_REJECTS) {
                rejectCount.set(idx, rejects + 1);
                return prev; // 判定為誤判，沿用上一個可信位置
            }
            rejectCount.set(idx, 0);
            lastAcceptedPoint.set(idx, { x, y });
            return { x, y };
        }

        function smoothLandmarks(landmarks, t) {
            if (!smoothingEnabled) return landmarks;
            return landmarks.map((lm, i) => {
                if (!lm) return lm;
                const cleaned = rejectOutlier(i, lm.x, lm.y);
                const med = medianFilterPoint(i, cleaned.x, cleaned.y);
                const fx = getFilter(landmarkFiltersX, i);
                const fy = getFilter(landmarkFiltersY, i);
                return {
                    x: fx.filter(med.x, t),
                    y: fy.filter(med.y, t),
                    z: lm.z,
                    visibility: lm.visibility
                };
            });
        }

        // === 手腕軌跡相關 ===
        let wristTraceEnabled = false;
        const leftWristTrace = [];
        const rightWristTrace = [];
        const MAX_TRACE_POINTS = 120;
        // 兩個軌跡點至少要相距這麼遠才記錄，避免靜止時原地堆疊大量重複點
        const MIN_TRACE_SPACING = 0.004;

        // === FPS 計算相關 ===
        const frameTimes = [];
        let lastFPSUpdate = 0;

        let lastLandmarks = null; // 最近一次偵測到（並已平滑）的骨架點

        // === 共用 UI 函式 ===
        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = "block";
        }

        function hideError() {
            errorMsg.textContent = "";
            errorMsg.style.display = "none";
        }

        function setPlaybackStatus(text) {
            statusPlayback.textContent = text;
        }

        // === 初始化 MediaPipe Pose 模型 ===
        async function initPoseLandmarker() {
            loadingText.style.display = "block";
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );
                poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        // full 模型：手臂快速揮動時的關鍵點精度明顯優於 lite，
                        // 是減少「手臂點亂跳」最直接的一步
                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 1,
                    minPoseDetectionConfidence: 0.6,
                    minPosePresenceConfidence: 0.6,
                    minTrackingConfidence: 0.6
                });
                modelReady = true;
                loadingText.style.display = "none";
                statusModel.textContent = "已載入 (full)";
            } catch (e) {
                loadingText.style.display = "none";
                showError("MediaPipe 初始化失敗：" + e.message);
                console.error(e);
            }
        }

        function clearCanvas() {
            if (!canvas.width || !canvas.height) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function stopDetectLoop() {
            detecting = false;
            if (rvfcId !== null && typeof video.cancelVideoFrameCallback === "function") {
                video.cancelVideoFrameCallback(rvfcId);
            }
            rvfcId = null;
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
            }
            rafId = null;
        }

        function startDetectLoop() {
            if (detecting) return;
            if (video.paused || video.ended) return;
            detecting = true;
            if (hasRVFC) {
                rvfcId = video.requestVideoFrameCallback(onVideoFrame);
            } else {
                rafId = requestAnimationFrame(onAnimationFrame);
            }
        }

        function onVideoFrame() {
            processFrame();
            if (detecting && !video.paused && !video.ended) {
                rvfcId = video.requestVideoFrameCallback(onVideoFrame);
            } else {
                detecting = false;
            }
        }

        function onAnimationFrame() {
            processFrame();
            if (detecting && !video.paused && !video.ended) {
                rafId = requestAnimationFrame(onAnimationFrame);
            } else {
                detecting = false;
            }
        }

        function updateFPS(now) {
            frameTimes.push(now);
            while (frameTimes.length && frameTimes[0] <= now - 1000) {
                frameTimes.shift();
            }
            const fps = frameTimes.length;
            if (now - lastFPSUpdate > 200) {
                statusFPS.textContent = fps.toFixed(0) + " FPS";
                lastFPSUpdate = now;
            }
        }

        // 單幀處理：畫背景 + 骨架偵測 + 繪製
        function processFrame() {
            const now = performance.now();
            updateFPS(now);

            // 1. 畫背景：影片畫面，或純黑
            if (blackBgEnabled) {
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                try {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                } catch (e) {
                    // 影片剛開始可能尚無 frame
                }
            }

            if (!poseLandmarker || !modelReady) return;
            if (!skeletonEnabled) return;

            try {
                // 2. 每個新影片幀都做一次偵測。
                //    先前版本用固定毫秒節流，會讓偵測慢於畫面更新，
                //    中間的幀重複套用舊座標 → 手臂快速移動時就是「停一下、跳一格」的階梯感。
                const result = poseLandmarker.detectForVideo(video, now);
                if (result.landmarks && result.landmarks.length > 0) {
                    lastLandmarks = smoothLandmarks(result.landmarks[0], now);
                    // 3. 軌跡只在拿到新偵測結果時累積（不再每個繪製幀重複 push 同一點）
                    if (wristTraceEnabled) {
                        updateWristTrace(lastLandmarks);
                    }
                }

                if (lastLandmarks) {
                    if (wristTraceEnabled) drawWristTrace();
                    drawSkeleton(lastLandmarks);
                }
            } catch (e) {
                console.error("detectForVideo 錯誤:", e);
            }
        }

        // 更新手腕軌跡：只收可信度足夠、且與前一點有足夠間距的點
        function updateWristTrace(landmarks) {
            if (!landmarks || !Array.isArray(landmarks)) return;
            pushTracePoint(leftWristTrace, landmarks[LEFT_WRIST]);
            pushTracePoint(rightWristTrace, landmarks[RIGHT_WRIST]);
        }

        function pushTracePoint(trace, lm) {
            if (!lm) return;
            if (lm.visibility != null && lm.visibility < MIN_VISIBILITY_TRACE) return;

            const last = trace[trace.length - 1];
            if (last) {
                const d = Math.hypot(lm.x - last.x, lm.y - last.y);
                if (d < MIN_TRACE_SPACING) return; // 幾乎沒動，不重複記錄
            }
            trace.push({ x: lm.x, y: lm.y });
            if (trace.length > MAX_TRACE_POINTS) trace.shift();
        }

        function clearWristTrace() {
            leftWristTrace.length = 0;
            rightWristTrace.length = 0;
        }

        // 畫手腕軌跡：以中點做控制點的平滑曲線，越舊越淡
        function drawWristTrace() {
            drawFadingTrace(leftWristTrace, "0,200,255");
            drawFadingTrace(rightWristTrace, "255,70,70");
        }

        function drawFadingTrace(points, rgb) {
            if (points.length < 3) return;

            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            // 分段繪製，讓尾端逐漸淡出，看起來像流暢的拖尾
            for (let i = 1; i < points.length - 1; i++) {
                const t = i / (points.length - 1);
                const cur = points[i];
                const next = points[i + 1];

                const curX = cur.x * canvas.width;
                const curY = cur.y * canvas.height;
                const nextX = next.x * canvas.width;
                const nextY = next.y * canvas.height;
                const prev = points[i - 1];
                const prevMidX = (prev.x * canvas.width + curX) / 2;
                const prevMidY = (prev.y * canvas.height + curY) / 2;
                const midX = (curX + nextX) / 2;
                const midY = (curY + nextY) / 2;

                ctx.beginPath();
                ctx.strokeStyle = `rgba(${rgb},${(0.15 + 0.75 * t).toFixed(3)})`;
                ctx.lineWidth = 2 + 4 * t;
                ctx.moveTo(prevMidX, prevMidY);
                ctx.quadraticCurveTo(curX, curY, midX, midY);
                ctx.stroke();
            }
        }

        // 畫骨架線段與節點
        function drawSkeleton(landmarks) {
            if (!landmarks || !Array.isArray(landmarks)) return;

            // 骨架連接關係（不含手指）
            const connections = [
                [11, 12], [11, 23], [12, 24], [23, 24],
                [11, 13], [13, 15], [12, 14], [14, 16],
                [23, 25], [25, 27], [27, 29], [29, 31],
                [24, 26], [26, 28], [28, 30], [30, 32]
            ];

            const visible = (lm) =>
                lm && (lm.visibility == null || lm.visibility >= MIN_VISIBILITY_DRAW);

            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineCap = "round";

            for (const [s, e] of connections) {
                const a = landmarks[s];
                const b = landmarks[e];
                if (!visible(a) || !visible(b)) continue; // 任一端不可信就不連線，避免亂拉線
                ctx.beginPath();
                ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
                ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
                ctx.stroke();
            }

            for (let i = 0; i < landmarks.length; i++) {
                if (i <= 10) continue;            // 0–10 為頭部/臉部
                if (i >= 17 && i <= 22) continue; // 17–22 為手指節點
                const lm = landmarks[i];
                if (!visible(lm)) continue;

                const x = lm.x * canvas.width;
                const y = lm.y * canvas.height;
                const alpha = lm.visibility != null ? lm.visibility : 0.8;

                ctx.beginPath();
                ctx.fillStyle = `rgba(255,0,0,${alpha})`;
                ctx.arc(x, y, 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // === 檔案載入與影片事件 ===
        uploadBtn.addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            hideError();
            stopDetectLoop();
            video.pause();
            clearCanvas();
            clearWristTrace();
            resetSmoothing();
            lastLandmarks = null;

            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }

            const url = URL.createObjectURL(file);
            currentObjectUrl = url;
            video.src = url;
            setPlaybackStatus("載入影片中…");
        });

        video.addEventListener("loadedmetadata", () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            canvasContainer.style.display = "block";

            playBtn.disabled = false;
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            toggleSkeletonBtn.disabled = false;
            toggleWristTraceBtn.disabled = false;
            toggleSmoothBtn.disabled = false;
            toggleBlackBgBtn.disabled = false;

            video.currentTime = 0;
            clearCanvas();
            setPlaybackStatus("待機");
        });

        video.addEventListener("play", () => {
            hideError();
            setPlaybackStatus("播放中");
            startDetectLoop();
        });

        video.addEventListener("pause", () => {
            stopDetectLoop();
            if (!video.ended) setPlaybackStatus("已暫停");
        });

        video.addEventListener("ended", () => {
            stopDetectLoop();
            setPlaybackStatus("已結束");
        });

        video.addEventListener("error", (e) => {
            const err = video.error;
            const msg = err
                ? `影片載入失敗 (錯誤碼 ${err.code}): ${err.message}`
                : "影片載入失敗";
            showError(msg + "\n\n請確認影片為 H.264 編碼的 MP4 格式");
            console.error("影片錯誤:", e, err);
        });

        // === 提供給 HTML 按鈕呼叫的控制函式 ===
        window.playVideo = async function () {
            hideError();
            try {
                await video.play();
            } catch (e) {
                showError("播放失敗：" + e.message);
                console.error("播放錯誤:", e);
            }
        };

        window.pauseVideo = function () {
            video.pause();
        };

        window.resetVideo = function () {
            stopDetectLoop();
            clearCanvas();
            clearWristTrace();
            resetSmoothing();
            lastLandmarks = null;
            video.currentTime = 0;
            video.play()
                .then(() => {
                    setPlaybackStatus("播放中");
                    startDetectLoop();
                })
                .catch((e) => {
                    showError("重新播放失敗：" + e.message);
                    console.error("重新播放錯誤:", e);
                });
        };

        window.toggleSkeleton = function () {
            skeletonEnabled = !skeletonEnabled;
            toggleSkeletonBtn.textContent = skeletonEnabled ? "骨架：開" : "骨架：關";
            statusSkeletonShow.textContent = skeletonEnabled ? "開" : "關";
            if (skeletonEnabled && !video.paused && !video.ended && !detecting) {
                startDetectLoop();
            }
        };

        window.toggleWristTrace = function () {
            wristTraceEnabled = !wristTraceEnabled;
            toggleWristTraceBtn.textContent = wristTraceEnabled ? "手腕軌跡：開" : "手腕軌跡：關";
            statusWristTrace.textContent = wristTraceEnabled ? "開" : "關";
            if (!wristTraceEnabled) clearWristTrace();
        };

        window.toggleSmoothing = function () {
            smoothingEnabled = !smoothingEnabled;
            resetSmoothing();
            toggleSmoothBtn.textContent = smoothingEnabled ? "平滑：開" : "平滑：關";
            statusSmooth.textContent = smoothingEnabled ? "開" : "關（原始座標，會明顯較抖）";
        };

        window.toggleBlackBg = function () {
            blackBgEnabled = !blackBgEnabled;
            canvasContainer.classList.toggle("black-bg", blackBgEnabled);
            toggleBlackBgBtn.textContent = blackBgEnabled ? "背景：純黑" : "背景：影片";
            statusBlackBg.textContent = blackBgEnabled ? "純黑（只看點線軌跡）" : "影片";
        };

        // 初始化 Pose 模型
        initPoseLandmarker();
    </script>
</body>
</html>
