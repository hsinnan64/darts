<!-- 五個頁面共用的頁尾片段（index.html / camera.html / help.html / privacy.html / sponsor.html）。
     由 footer.js 用 fetch 抓進來，插到每一頁的 <div id="siteFooter"></div>，
     插入後 footer.js 會自己翻譯成目前的語言（讀 localStorage.darts_lang）。

     ⚠️ 這不是完整的 HTML 文件，不要加 <!DOCTYPE>/<html>/<head>/<body>，
        直接就是要被塞進頁面的內容。

     ⚠️ 四語言翻譯表在 footer.js 裡（不是這裡）——這裡只放結構與 data-i18n key，
        文字內容改這裡沒用，要改 footer.js 的 FOOTER_I18N。

     改版本號只改這裡一個地方：下面 #siteVersion／#siteUpdated 兩個 span，
     五個頁面全部一起更新，不用再每個檔案分別改。 -->
<nav class="site-links">

    <a href="sponsor.html" data-i18n="nav.sponsor">贊助支持</a>

</nav>
